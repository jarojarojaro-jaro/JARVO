agent: tars-web

# Wersje npm przypina infra/node/package.json (jedno źródło prawdy); tutaj: opis i healthchecki.
tools:
  - {name: lighthouse, source: https://github.com/GoogleChrome/lighthouse, license: Apache-2.0, version: see-infra, install: {method: npm, spec: lighthouse}, integration: cli, used_by_skills: [audyt-strony], healthcheck: "lighthouse --version", autonomy: A0}
  - {name: axe-core, source: https://github.com/dequelabs/axe-core, license: MPL-2.0, version: see-infra, install: {method: npm, spec: axe-core}, integration: skill-script, used_by_skills: [audyt-strony], healthcheck: "node -e \"require('axe-core')\"", autonomy: A0}
  - {name: playwright-core, source: https://github.com/microsoft/playwright, license: Apache-2.0, version: see-infra, install: {method: npm, spec: playwright-core}, integration: skill-script, used_by_skills: [audyt-strony, brand-z-url, nowa-strona, bramka-jakosci], healthcheck: "node -e \"require('playwright-core')\"", autonomy: A0}
  - {name: linkinator, source: https://github.com/JustinBeckwith/linkinator, license: MIT, version: see-infra, install: {method: npm, spec: linkinator}, integration: cli, used_by_skills: [audyt-strony], healthcheck: "linkinator --version", autonomy: A0}
  - {name: html-validate, source: https://github.com/html-validate/html-validate, license: MIT, version: see-infra, install: {method: npm, spec: html-validate}, integration: cli, used_by_skills: [audyt-strony, nowa-strona], healthcheck: "html-validate --version", autonomy: A0}
  - {name: sharp, source: https://github.com/lovell/sharp, license: Apache-2.0, version: see-infra, install: {method: npm, spec: sharp}, integration: skill-script, used_by_skills: [optymalizacja-obrazow], healthcheck: "node -e \"require('sharp')\"", autonomy: A1}
  - {name: favicons, source: https://github.com/itgalaxy/favicons, license: MIT, version: see-infra, install: {method: npm, spec: favicons}, integration: skill-script, used_by_skills: [favicon-i-meta], healthcheck: "test -f /opt/tars/node/node_modules/favicons/package.json", autonomy: A1}
  - {name: svgo, source: https://github.com/svg/svgo, license: MIT, version: see-infra, install: {method: npm, spec: svgo}, integration: cli, used_by_skills: [optymalizacja-obrazow], healthcheck: "svgo --version", autonomy: A1}
  - {name: agent-browser, source: https://github.com/vercel-labs/agent-browser, license: Apache-2.0, version: see-infra, install: {method: npm, spec: agent-browser}, integration: hermes-browser-driver, used_by_skills: [audyt-strony, brand-z-url], healthcheck: "agent-browser --version", autonomy: A0, notes: "Sterownik browser_* z silnikiem Lightpanda (lekki); zrzuty i render przez Chromium."}
  - {name: dembrandt, source: https://github.com/dembrandt/dembrandt, license: MIT, version: see-infra, install: {method: npm, spec: dembrandt}, integration: skill-script, used_by_skills: [brand-z-url], healthcheck: "dembrandt --version", autonomy: A0}
  - {name: astro, source: https://github.com/withastro/astro, license: MIT, version: per-project, install: {method: npm, spec: "npm create astro@latest (per projekt)"}, integration: cli, used_by_skills: [nowa-strona, landing-produktowy], healthcheck: "node --version", autonomy: A1}
  - {name: claude-seo-runtime, source: https://github.com/AgriciDaniel/claude-seo, license: MIT, version: e77e783e38eeb738424eb72117abbd2dacdd88af, install: {method: git, spec: /opt/tars/vendor/claude-seo}, integration: skill-script, used_by_skills: [seo-technical, seo-page, seo-audit], healthcheck: "\"$CLAUDE_PLUGIN_ROOT/scripts/claude-seo\" --help", autonomy: A0}

sidecars: []
hermes_skills: [popular-web-designs, design-md, claude-design, impeccable, scrollcraft, publish-site, cloudflare-temporary-deploy]
hermes_plugins: [image-utils]
mcp_servers: [context7]    # dokumentacja bibliotek; włączany w config.yaml po weryfikacji w fazie 0
env_requires: [OPENROUTER_API_KEY]
