agent: jarvo-ads

tools:
  - name: skarbiec
    source: services/skarbiec (to repo)
    license: MIT
    version: "repo"
    install: {method: image, spec: "osobny kontener jarvo-skarbiec (infra/docker-compose.yml)"}
    integration: sidecar
    used_by_skills: [podlacz-konto, start-kampanii, optymalizacja, audyt-konta, raport-reklam]
    healthcheck: "python3 $HERMES_HOME/scripts/ads.py doctor --quiet"
    autonomy: A2
    optional: true
    notes: "Odłożone (decyzja właściciela 2026-10-10): agent oddaje paczkę do publikacji (paczka.py), właściciel publikuje. Skarbiec trzymałby tokeny Meta/Google, politykę budżetu, koperty i kody zgody."
