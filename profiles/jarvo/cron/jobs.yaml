# Rutyny Jarva. scripts/build.py zamienia ten plik na cron/jobs.json przez API crona Hermesa.
# `id` musi być stały (aktualizacje dystrybucji scalają zadania po id). Harmonogramy w strefie
# z config.yaml (timezone). Z dystrybucji zadania instalują się WSTRZYMANE: włącz je świadomie
# (`hermes -p jarvo cron resume <id>`) po sprawdzeniu, że Telegram działa (scripts/install-fleet.sh --resume-cron).
# Głęboko myśli tylko przegląd tygodnia (wnioski, lekcje). Patrol i brief: płytkie myślenie, bo skrypt już zebrał dane;
# model zostaje modelem Jarva (przypięty tu nie poszedłby za zmianą modelu w panelu). Świeżość wiedzy bez modelu (no_agent).

jobs:
  - id: jarvo-patrol
    name: "Patrol floty"
    schedule: "every 30m"
    script: patrol.py
    reasoning_effort: low
    skills: [patrol]
    enabled_toolsets: [kanban, file, memory, skills]
    deliver: "@@OWNER_DELIVER@@"
    prompt: >-
      Patrol floty. Powyżej masz sygnały z tablicy i dziennika misji. Postępuj według skilla `patrol`.
      Napraw to, co możesz, sam. Jeśli nic nie wymaga uwagi użytkownika, odpowiedz dokładnie [SILENT].
      W przeciwnym razie jedna zwięzła wiadomość po polsku, w stylu efektów.

  - id: jarvo-daily-brief
    name: "Poranny brief"
    schedule: "50 7 * * 1-5"
    script: brief_daily.py
    reasoning_effort: low
    skills: [daily-brief, decision-queue, prosty-polski]
    enabled_toolsets: [kanban, file, memory, skills]
    deliver: "@@OWNER_DELIVER@@"
    prompt: >-
      Przygotuj poranny brief według skilla `daily-brief` na podstawie danych powyżej
      oraz @@MISSIONS_DIR@@/INDEX.md. Po polsku, maksymalnie 12 linii.

  - id: jarvo-weekly-review
    name: "Przegląd tygodnia"
    schedule: "50 18 * * 0"
    script: review_weekly.py
    skills: [weekly-review, fleet-improvement, prosty-polski]
    enabled_toolsets: [kanban, file, memory, skills, session_search]
    deliver: "@@OWNER_DELIVER@@"
    prompt: >-
      Przygotuj przegląd tygodnia według skilla `weekly-review` na podstawie danych powyżej.
      Propozycje ulepszeń tylko z dowodami. Brak aktywności → [SILENT].

  - id: jarvo-knowledge-freshness
    name: "Świeżość wiedzy"
    schedule: "20 9 1 * *"
    # daty `reviewed:` skilli liczy skrypt (0 tokenów); puste wyjście = cisza
    script: swiezosc.py
    no_agent: true
    deliver: "@@OWNER_DELIVER@@"
