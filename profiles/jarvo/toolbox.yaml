agent: jarvo

tools:
  - name: hermes-cli
    source: https://github.com/NousResearch/hermes-agent
    license: MIT
    version: image
    install: {method: image, spec: nousresearch/hermes-agent}
    integration: cli
    used_by_skills: [patrol, daily-brief, weekly-review]
    healthcheck: "hermes kanban stats --json"
    autonomy: A0
  - name: lighthouse
    source: https://github.com/GoogleChrome/lighthouse
    license: Apache-2.0
    version: "13.5.0"
    install: {method: npm, spec: "lighthouse@13.5.0"}
    integration: cli
    used_by_skills: [sdlc-review]
    healthcheck: "lighthouse --version"
    autonomy: A0
    notes: "Sędzia weryfikuje twierdzenia jarvo-web (runda 2: wykonanie)."
  - name: playwright
    source: https://github.com/microsoft/playwright
    license: Apache-2.0
    version: image
    install: {method: image, spec: "chromium w obrazie Hermesa"}
    integration: cli
    used_by_skills: [sdlc-review]
    healthcheck: "node -e \"require('playwright-core')\""
    autonomy: A0
  - {name: indra-ocr, source: https://github.com/datalab-to/indra, license: "Apache-2.0 (kod); modele: zmodyfikowana OpenRAIL-M (do 20 mln USD, bez produktu konkurującego z Datalab)", version: "0.3.2 (modele v3.1.1)", install: {method: image, spec: "venv /opt/jarvo/venvs/ocr (Python 3.12), infra/python/requirements-ocr.txt (sha256, --require-hashes, --no-deps, bez huggingface_hub); modele /opt/jarvo/models/indra-ocr (sha256)"}, integration: skill-script, used_by_skills: [odczyt-ekranu], healthcheck: "python3 @@REPO_DIR@@/shared/skills/odczyt-ekranu/scripts/ocr.py --stan", autonomy: A0, notes: "Wspólny odczyt ekranu (decyzja właściciela 2026-10-17): zrzut ekranu, skan, PDF, klatka filmu → tekst, ramki, --szukaj; bez sieci (modele w obrazie, gniazda zablokowane). Zapas: Tesseract pol+eng."}
  - name: komputer-jarva
    source: "własny (infra/komputer: pulpit Xvnc, Chromium, wejście z twardymi zasadami; komputer/jarvo_cua.py: bramka)"
    license: MIT
    version: "obraz jarvo-komputer (K2)"
    install: {method: image, spec: "usługa compose `komputer` (profil komputer), włącza właściciel: jarvo komputer on"}
    integration: hermes-plugin
    used_by_skills: [praca-na-ekranie, formularze, dane-z-ekranu, przejscie-strony, oddaj-ekran]
    healthcheck: "python3 @@REPO_DIR@@/komputer/plugin/__init__.py stan"
    autonomy: A1
    optional: true
    notes: "computer_use Hermesa → bramka jarvo_cua.py → cua.sock → wejście (twarde zasady, ukrywanie sekretów, dziennik) → cua-driver. Wtyczka jarvo-komputer: stan, dziennik, oddanie ekranu właścicielowi. Bez włączonego Komputera Jarvo nie ma ekranu (healthcheck opcjonalny)."
  - name: przegladarka-jarva
    source: "własny (komputer/: usluga.py, sterownik_cdp.py, wejscie_natywne.py, filtr.py, kanal.py) + Chrome for Testing (GoogleChromeLabs/chrome-for-testing)"
    license: "MIT (kod Jarva); BSD-3-Clause i warunki Google (Chrome for Testing)"
    version: "Chrome for Testing Stable 156.0.8078.47 (wpis chrome-komputer manifestu natywnego, kiedy: przy-uzyciu, sha256 z przeglądu)"
    install: {method: binary, spec: "instalacja natywna: jarvo komputer on pobiera przeglądarkę z sumą przy pierwszym włączeniu (ok. 200 MB); jarvo komputer odswiez bierze nowy pin po jarvo update"}
    integration: hermes-plugin
    used_by_skills: [praca-na-ekranie, formularze, dane-z-ekranu, przejscie-strony, oddaj-ekran]
    autonomy: A1
    optional: true
    notes: "Komputer Jarva natywnie (docs/NATYWNIE.md, etap E10): computer_use Hermesa i narzędzie komputer (idz, patrz, kroki, czekaj) → nakładka jarvo-cua → bramka jarvo_cua.py → kanał usługi (potok z DACL właściciela albo gniazdo 0600) → wejście z twardymi zasadami (rdzeń z infra/komputer i zasady natywne: schowek, okna potwierdzeń, wybór pliku, CAPTCHA; każdy krok paczki run_steps oceniony osobno) → sterownik CDP po potoku (navigate, run_steps, wait_for) → przeglądarka Jarva z osobnym profilem; cały ruch przez proxy filtrujące z samotestem (bez sieci lokalnej, metadanych chmury, panelu i API Jarva, portu 25), WebRTC i QUIC bez UDP. Pasek adresu karty to element 0 migawki. Pauzę zdejmuje token właściciela (jarvo komputer wznow); ten sam token daje HQ podgląd (Page.startScreencast) i Przejmij."
  - name: cua-driver
    source: https://github.com/trycua/cua
    license: MIT
    version: "cua-driver-rs 0.21.0 (SHA-256 w infra/komputer/Dockerfile, vendor/zrodla.yaml)"
    install: {method: binary, spec: "w obrazie jarvo-komputer, telemetria i aktualizacje wyłączone"}
    integration: hermes-plugin
    used_by_skills: [praca-na-ekranie]
    autonomy: A1
    optional: true
    notes: "Sterownik ekranu (AT-SPI, zrzuty, wejście w tle i na wierzchu w aktywnym oknie). Działa tylko w Komputerze Jarva, nie w jarvo-hermes."

sidecars: []
hermes_skills: []          # hermes-agent jest dosiewany zawsze
hermes_plugins: [langfuse, jarvo-komputer] # langfuse: ślady i koszty (opcjonalnie); jarvo-komputer: narzędzie `komputer`
mcp_servers: [phone]       # PHONEUSE, wszystkie narzędzia; w config.yaml dopiero po `jarvo telefon on` (docs/MOBILE.md)
env_requires: [OPENROUTER_API_KEY]
