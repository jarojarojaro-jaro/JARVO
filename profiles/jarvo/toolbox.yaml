agent: jarvo

tools:
  - name: hermes-cli
    source: https://github.com/NousResearch/hermes-agent
    license: MIT
    version: image
    install: {method: image, spec: nousresearch/hermes-agent}
    integration: cli
    used_by_skills: [patrol, daily-brief, weekly-review]
    healthcheck: "hermes kanban stats --json"
    autonomy: A0
  - name: lighthouse
    source: https://github.com/GoogleChrome/lighthouse
    license: Apache-2.0
    version: "13.5.0"
    install: {method: npm, spec: "lighthouse@13.5.0"}
    integration: cli
    used_by_skills: [sdlc-review]
    healthcheck: "lighthouse --version"
    autonomy: A0
    notes: "Sędzia weryfikuje twierdzenia jarvo-web (runda 2: wykonanie)."
  - name: playwright
    source: https://github.com/microsoft/playwright
    license: Apache-2.0
    version: image
    install: {method: image, spec: "chromium w obrazie Hermesa"}
    integration: cli
    used_by_skills: [sdlc-review]
    healthcheck: "node -e \"require('playwright-core')\""
    autonomy: A0
  - {name: indra-ocr, source: https://github.com/datalab-to/indra, license: "Apache-2.0 (kod); modele: zmodyfikowana OpenRAIL-M (do 20 mln USD, bez produktu konkurującego z Datalab)", version: "0.3.2 (modele v3.1.1)", install: {method: image, spec: "venv /opt/jarvo/venvs/ocr (Python 3.12), infra/python/requirements-ocr.txt (sha256, --require-hashes, --no-deps, bez huggingface_hub); modele /opt/jarvo/models/indra-ocr (sha256)"}, integration: skill-script, used_by_skills: [odczyt-ekranu], healthcheck: "python3 /opt/jarvo/repo/shared/skills/odczyt-ekranu/scripts/ocr.py --stan", autonomy: A0, notes: "Wspólny odczyt ekranu (decyzja właściciela 2026-10-17): zrzut ekranu, skan, PDF, klatka filmu → tekst, ramki, --szukaj; bez sieci (modele w obrazie, gniazda zablokowane). Zapas: Tesseract pol+eng."}

sidecars: []
hermes_skills: []          # hermes-agent jest dosiewany zawsze
hermes_plugins: [langfuse] # faza 6: ślady i koszty (opcjonalnie)
mcp_servers: []
env_requires: [OPENROUTER_API_KEY]
