# Jarvo: Main Judge. Tokeny @@...@@ podstawia scripts/build.py z fleet.yaml.
model:
  provider: "@@PROVIDER@@"
  default: "@@MODEL@@"

agent:
  reasoning_effort: high
  max_turns: 200

timezone: "@@TIMEZONE@@"

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 3000
  user_char_limit: 2000
  nudge_interval: 8

skills:
  creation_nudge_interval: 0      # Jarvo nie tworzy skilli sam; ulepszenia idą przez fleet-improvement → repo

web:
  search_backend: searxng         # SEARXNG_URL ustawia docker-compose (własny SearXNG)

# Czat (Telegram): bez terminala. Pracownik-sędzia (tor review, platforma cli): pełna weryfikacja.
platform_toolsets:
  telegram: [kanban, memory, file, web, session_search, clarify, todo, skills, cronjob]
  api_server: [kanban, memory, file, web, session_search, todo, skills, cronjob]   # czat Jarvo HQ: jak Telegram, bez clarify (API go nie obsługuje)
  cli: [kanban, memory, file, terminal, web, browser, vision, session_search, todo, skills, cronjob]
  cron: [kanban, memory, file, skills, session_search]

terminal:
  backend: local
  cwd: "@@WORKSPACES_DIR@@/jarvo"
  timeout: 300

# Przeglądarka: wbudowane narzędzia browser_* przez agent-browser z silnikiem Lightpanda (~30 MB RAM
# na sesję zamiast ~300 MB Chromium). Zrzuty ekranu i strony, których Lightpanda nie obsłuży,
# Hermes sam przełącza na Chromium z obrazu.
browser:
  backend: "off"                  # bez trybu Browser Use (uvx browser-use pobierany w locie)
  engine: lightpanda
  inactivity_timeout: 120

# Wiadomości głosowe: Parakeet (jarvo-stt) uruchamiany na czas transkrypcji (HERMES_LOCAL_STT_COMMAND).
stt:
  provider: local_command
  language: pl

delegation:
  model: "@@DELEGATION_MODEL@@"
  provider: "@@PROVIDER@@"
  max_concurrent_children: 3      # wątki; każdy może otworzyć przeglądarkę

approvals:
  mode: smart
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  smart_policy: >-
    Always ESCALATE: production deployments, publishing or posting content, sending e-mail or
    messages to third parties, payments or purchases, deleting data outside /opt/data/jarvo/workspaces,
    changing DNS, credentials or account settings.
  deny:
    - "rm -rf /*"
    - "git push --force*"
    - "* | sh"
    - "* | bash"

security:
  protected_instruction_files: true

kanban:
  auto_subscribe_on_create: true

# Branding terminala: skórka Jarvo (branding/skin-jarvo.yaml). Telegram: bez osobnych komunikatów pośrednich („Sprawdzam…”
# przy każdym kroku; 12.11 w jednej rozmowie poszło ich ok. 110), ale z jednym dymkiem postępu edytowanym na żywo
# (każdy krok i narzędzie z podglądem) i z rozumowaniem w odpowiedzi: właściciel 14.11 widział tylko „typing” przez minuty.
display:
  skin: jarvo
  platforms:
    telegram:
      interim_assistant_messages: false
      tool_progress: all
      tool_progress_grouping: accumulate
      tool_preview_length: 80
      show_reasoning: true
      reasoning_style: blockquote
# odpowiedź pisze się na żywo (Telegram: natywne szkice), zamiast przyjść w całości po minucie
streaming:
  enabled: true
