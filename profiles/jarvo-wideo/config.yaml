# jarvo-wideo: wideograf. Tokeny @@...@@ podstawia scripts/build.py.
model:
  provider: "@@PROVIDER@@"
  default: "@@MODEL@@"

agent:
  reasoning_effort: low
  max_turns: 300

timezone: "@@TIMEZONE@@"

memory:
  memory_enabled: true
  user_profile_enabled: true
  nudge_interval: 12

skills:
  creation_nudge_interval: 20

web:
  search_backend: searxng

image_gen:
  provider: openrouter          # domyślny łańcuch modeli wtyczki (jakość → fallback)

video_gen:
  provider: openrouter          # katalog modeli pobierany na żywo z OpenRouter

# Lektor: Edge TTS (darmowy, bez klucza), polski głos domyślny dla narzędzia text_to_speech.
# Filmy: scripts/film.py (ten sam silnik, z czasem słów do napisów karaoke).
tts:
  provider: edge
  edge:
    voice: pl-PL-MarekNeural

platform_toolsets:
  cli: [terminal, file, web, browser, vision, image_gen, video_gen, tts, delegation, memory, skills, todo, session_search]
  telegram: [terminal, file, web, browser, vision, image_gen, video_gen, tts, delegation, memory, skills, todo, session_search, clarify]
  api_server: [terminal, file, web, browser, vision, image_gen, video_gen, tts, delegation, memory, skills, todo, session_search]   # czat Jarvo HQ: jak Telegram, bez clarify (API go nie obsługuje)
  cron: [terminal, file, web, memory, skills]

terminal:
  backend: local
  cwd: "@@WORKSPACES_DIR@@/jarvo-wideo"
  timeout: 1800                 # render i pobieranie ujęć trwają

# Przeglądarka: wbudowane narzędzia browser_* przez agent-browser z silnikiem Lightpanda (~30 MB RAM
# na sesję zamiast ~300 MB Chromium). Zrzuty ekranu i strony, których Lightpanda nie obsłuży,
# Hermes sam przełącza na Chromium z obrazu.
browser:
  backend: "off"                  # bez trybu Browser Use (uvx browser-use pobierany w locie)
  engine: lightpanda
  inactivity_timeout: 120

# Wiadomości głosowe: Parakeet (jarvo-stt) uruchamiany na czas transkrypcji (HERMES_LOCAL_STT_COMMAND).
stt:
  provider: local_command
  language: pl

delegation:
  model: "@@DELEGATION_MODEL@@"
  provider: "@@PROVIDER@@"
  max_concurrent_children: 2      # wątki; każdy może otworzyć przeglądarkę

approvals:
  mode: smart
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  smart_policy: >-
    Always ESCALATE: publishing, uploading or scheduling videos or posts on any platform (YouTube, TikTok,
    Instagram, Facebook, LinkedIn, X), sending e-mails or messages, buying stock footage or music,
    starting or changing paid ad campaigns, uploading content to third-party accounts.
  deny:
    - "rm -rf /*"
    - "* | sh"
    - "* | bash"

security:
  protected_instruction_files: true

# Branding terminala: skórka Jarvo (branding/skin-jarvo.yaml)
display:
  skin: jarvo
