name: tars-wideo
version: 0.1.0
description: "Wideograf: krótkie filmy, montaż, napisy PL, lektor, warianty A/B, klipy; publikacja tylko za zgodą."
author: "Jarvo fleet"
license: MIT
env_requires:
  - name: OPENROUTER_API_KEY
    description: "Klucz OpenRouter dla Wideografa (model + generacja obrazów i wideo; osobny klucz z limitem)"
    required: true
  - name: PEXELS_API_KEY
    description: "Darmowe ujęcia i zdjęcia stock z Pexels (pexels.com/api); wystarczy ten albo PIXABAY_API_KEY"
    required: false
  - name: PIXABAY_API_KEY
    description: "Darmowe ujęcia i zdjęcia stock z Pixabay (pixabay.com/api/docs)"
    required: false
