  - {name: pixabay-api, source: https://pixabay.com/api/docs/, license: "Pixabay Content License", version: v1, install: {method: api, spec: "PIXABAY_API_KEY"}, integration: skill-script, used_by_skills: [material-stock, krotki-film], healthcheck: "test -n \"$PIXABAY_API_KEY\" || test -n \"$PEXELS_API_KEY\"", autonomy: A1, optional: true, notes: "Darmowy klucz; wyniki zapytań cache'owane 24 h (wymóg API)."}
