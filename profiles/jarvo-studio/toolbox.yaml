agent: jarvo-studio

tools:
  - {name: ffmpeg, source: https://ffmpeg.org, license: LGPL/GPL, version: image, install: {method: image, spec: "w obrazie Hermesa"}, integration: cli, used_by_skills: [formaty-platform], healthcheck: "ffmpeg -version", autonomy: A1, notes: "ffprobe dla check_media.py (wymiary, waga); wideo robi jarvo-wideo."}
  - {name: rembg, optional: true, source: https://github.com/danielgatis/rembg, license: MIT, version: see-infra, install: {method: pip-venv, spec: "rembg[cli]"}, integration: cli, used_by_skills: [grafika-social], healthcheck: "/opt/jarvo/venv/bin/rembg --help", autonomy: A1, notes: "tylko z JARVO_EXTRAS=\"rembg\" (~0,5 GB); bez niego: obraz z przezroczystym tłem z generatora albo prośba o PNG."}
  - {name: playwright-core, source: https://github.com/microsoft/playwright, license: Apache-2.0, version: see-infra, install: {method: npm, spec: playwright-core}, integration: skill-script, used_by_skills: [grafika-social], healthcheck: "node -e \"require('playwright-core')\"", autonomy: A1}
  - {name: sharp, source: https://github.com/lovell/sharp, license: Apache-2.0, version: see-infra, install: {method: npm, spec: sharp}, integration: cli, used_by_skills: [grafika-social], healthcheck: "node -e \"require('sharp')\"", autonomy: A1}
  - {name: lemo-wake, source: https://github.com/lemomo-ai/lemo-wake, license: "CC BY-NC 4.0 (komercyjnie za zgodą autora)", version: "ebb758c (lock)", install: {method: git, spec: "lemo_wake.py instaluj → /opt/data/jarvo/narzedzia/lemo-wake (+ venv z przypiętymi pakietami, playwright-core 1.63.0); modele ONNX ~600 MB po zgodzie właściciela"}, integration: skill-script, used_by_skills: [zywy-obraz, lemo-wake, lemo-wake-layers], healthcheck: "python3 /opt/jarvo/repo/profiles/jarvo-studio/scripts/lemo_wake.py sprawdz | grep -q '\"biblioteka\": true'", autonomy: A1, optional: true, notes: "obraz → pętla 5 s (MP4/GIF/WebP) i warstwy PSD; przeglądarka i ffmpeg z obrazu; bez skilla upload."}

sidecars:
  - name: postiz
    image: ghcr.io/gitroomhq/postiz-app
    license: AGPL-3.0
    url_env: POSTIZ_URL
    optional: true           # sidecar dochodzi, gdy Studio zacznie publikować
    healthcheck: "curl -fsS \"$POSTIZ_URL\" >/dev/null"

hermes_skills: [baoyu-infographic, humanizer, social-media-content-calendar, creative-ideation, meme-generation, excalidraw, concept-diagrams]
hermes_plugins: []
mcp_servers: []            # opcjonalnie: canva, figma, cloudinary (po konfiguracji kont)
env_requires: [OPENROUTER_API_KEY]
