# jarvo-web: Web Senior Dev. Tokeny @@...@@ podstawia scripts/build.py.
model:
  provider: "@@PROVIDER@@"
  default: "@@MODEL@@"

agent:
  reasoning_effort: low
  max_turns: 300

timezone: "@@TIMEZONE@@"

memory:
  memory_enabled: true
  user_profile_enabled: true
  nudge_interval: 12

skills:
  creation_nudge_interval: 20

web:
  search_backend: searxng

platform_toolsets:
  cli: [terminal, file, web, browser, vision, delegation, memory, skills, todo, session_search]
  telegram: [terminal, file, web, browser, vision, delegation, memory, skills, todo, session_search, clarify]
  api_server: [terminal, file, web, browser, vision, delegation, memory, skills, todo, session_search]   # czat Jarvo HQ: jak Telegram, bez clarify (API go nie obsługuje)
  cron: [terminal, file, web, browser, memory, skills]

terminal:
  backend: local
  cwd: "@@WORKSPACES_DIR@@/jarvo-web"
  timeout: 600

# Przeglądarka: wbudowane narzędzia browser_* przez agent-browser z silnikiem Lightpanda (~30 MB RAM
# na sesję zamiast ~300 MB Chromium). Zrzuty ekranu i strony, których Lightpanda nie obsłuży,
# Hermes sam przełącza na Chromium z obrazu.
browser:
  backend: "off"                  # bez trybu Browser Use (uvx browser-use pobierany w locie)
  engine: lightpanda
  inactivity_timeout: 120

# Wiadomości głosowe: Parakeet (jarvo-stt) uruchamiany na czas transkrypcji (HERMES_LOCAL_STT_COMMAND).
stt:
  provider: local_command
  language: pl

# Inspo (Nutlope/inspo, MIT): katalog 832 prawdziwych stron (2320 podstron) jako inspiracja przed projektem,
# skill inspiracje-stron. Pakiet z obrazu (infra/node/package.json, inspo-mcp 0.1.16), lokalnie po stdio;
# hostowanego endpointu nie używamy. Katalog pobiera z CDN autorów przy starcie procesu (~2,3 MB, wektory w tle),
# dlatego lazy: proces startuje przy pierwszym wywołaniu i znika po 15 min bezczynności (~220 MB RAM, gdy żyje).
# Bez TOGETHER_API_KEY: wyszukiwanie leksykalne (zapytania po angielsku) + filtry. W schemacie modelu tylko
# 6 narzędzi z tools.include (każde kosztuje tokeny przy każdym zapytaniu); profil serwera full, bo lite nie ma find_similar.
mcp_servers:
  inspo:
    command: /opt/jarvo/node/node_modules/.bin/inspo-mcp
    args: ["--stdio"]
    env:
      INSPO_PROFILE: "full"
      INSPO_IMAGES: "thumbs"        # miniatury: Hermes zapisuje je jako pliki (MEDIA:…), Web ogląda je narzędziem vision
      INSPO_MAX_TOKENS: "5000"      # sufit jednej odpowiedzi; wynik narzędzia wraca w każdej kolejnej turze
    lazy: true
    idle_timeout_seconds: 900
    connect_timeout: 60
    timeout: 90
    trust: untrusted                # cudzy kod: narzędzie bez readOnlyHint=true (np. w nowej wersji) czeka na zgodę;
                                    # 6 narzędzi z include ma readOnlyHint=true w 0.1.16, więc działają bez pytania
    tools:
      include: [recommend, search_screens, get_screen, get_design_system, get_site_pages, find_similar]
      resources: false
      prompts: false

delegation:
  model: "@@DELEGATION_MODEL@@"
  provider: "@@PROVIDER@@"
  max_concurrent_children: 2      # wątki; każdy może otworzyć przeglądarkę

approvals:
  mode: smart
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  smart_policy: >-
    Always ESCALATE: production deployments (netlify deploy --prod, wrangler pages deploy to a production
    branch, vercel --prod, gh-pages to a live domain), git push to main/master of a user repository,
    DNS or domain changes, deleting remote resources, paid services.
  deny:
    - "rm -rf /*"
    - "git push --force*"
    - "* | sh"
    - "* | bash"

security:
  protected_instruction_files: true

# Branding terminala: skórka Jarvo (branding/skin-jarvo.yaml)
display:
  skin: jarvo
