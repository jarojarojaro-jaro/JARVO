name: jarvo-web
version: 0.1.0
description: "Web Senior Dev: strony i landingi, SEO techniczne, wydajność, dostępność, favicony, obrazy, brand kit, wdrożenia."
author: "Jarvo fleet"
license: MIT
env_requires:
  - name: OPENROUTER_API_KEY
    description: "Klucz OpenRouter dla Web (osobny klucz z limitem kredytów)"
    required: true
  - name: CLOUDFLARE_API_TOKEN
    description: "Opcjonalnie: wdrożenia na Cloudflare Pages (tylko za zgodą użytkownika)"
    required: false
  - name: NETLIFY_AUTH_TOKEN
    description: "Opcjonalnie: wdrożenia na Netlify (tylko za zgodą użytkownika)"
    required: false
