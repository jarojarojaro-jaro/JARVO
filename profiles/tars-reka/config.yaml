# tars-reka: prawa ręka. Pełny katalog skilli Hermesa (brak .no-bundled-skills) + skille snajperów
# tylko do odczytu (build zamontowany :ro w kontenerze). Tokeny @@...@@ podstawia scripts/build.py.
model:
  provider: "@@PROVIDER@@"
  default: "@@MODEL@@"

agent:
  reasoning_effort: low
  max_turns: 250

timezone: "@@TIMEZONE@@"

memory:
  memory_enabled: true
  user_profile_enabled: true
  nudge_interval: 10

skills:
  creation_nudge_interval: 15
  external_dirs:
    - "@@BUILD_DIR@@/profiles/tars-sherlock/skills"
    - "@@BUILD_DIR@@/profiles/tars-web/skills"
    - "@@BUILD_DIR@@/profiles/tars-studio/skills"

web:
  search_backend: searxng

platform_toolsets:
  cli: [terminal, file, web, browser, vision, code_execution, delegation, memory, skills, todo, session_search]
  telegram: [terminal, file, web, browser, vision, code_execution, delegation, memory, skills, todo, session_search, clarify]
  cron: [terminal, file, web, memory, skills]

terminal:
  backend: local
  cwd: "@@WORKSPACES_DIR@@/tars-reka"
  timeout: 600

# Przeglądarka: wbudowane narzędzia browser_* przez agent-browser z silnikiem Lightpanda (~30 MB RAM
# na sesję zamiast ~300 MB Chromium). Zrzuty ekranu i strony, których Lightpanda nie obsłuży,
# Hermes sam przełącza na Chromium z obrazu.
browser:
  backend: "off"                  # bez trybu Browser Use (uvx browser-use pobierany w locie)
  engine: lightpanda
  inactivity_timeout: 120

# Wiadomości głosowe: Parakeet (tars-stt) uruchamiany na czas transkrypcji (HERMES_LOCAL_STT_COMMAND).
stt:
  provider: local_command
  language: pl

delegation:
  model: "@@DELEGATION_MODEL@@"
  provider: "@@PROVIDER@@"
  max_concurrent_children: 2      # wątki; każdy może otworzyć przeglądarkę

approvals:
  mode: smart
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  smart_policy: >-
    Always ESCALATE: sending e-mails or messages, actions on third-party accounts, purchases,
    deleting files outside /opt/data/tars/workspaces and /opt/data/tars/missions.
  deny:
    - "rm -rf /*"
    - "git push --force*"
    - "* | sh"
    - "* | bash"

security:
  protected_instruction_files: true

# Branding terminala: skórka Jarvo (branding/skin-tars.yaml)
display:
  skin: tars
