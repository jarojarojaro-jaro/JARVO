# Rutyny Jarodev. scripts/build.py zamienia ten plik na cron/jobs.json przez API crona Hermesa (stałe `id`).
# Rutyna instaluje się WSTRZYMANA (paused): włączasz ją sam, gdy przydzielisz telefon i podasz grupy FB
# (`hermes -p jarvo-jarodev cron resume jarodev-dzien`, docs/RUNBOOK.md). Skrypt poranek.py przygotowuje lejek
# bez modelu (retencja RODO, liczby, stan źródeł); agent zakłada kartę dnia dla siebie, bo ekran i telefon działają
# tylko na karcie albo w rozmowie, nie w rutynie (docs/KOMPUTER.md §7). Wysyłki i publikacji rutyna nie robi nigdy.

jobs:
  - id: jarodev-dzien
    name: "Jarodev: dzień pracy"
    schedule: "40 8 * * 1-6"        # pon–sob rano; w niedzielę cisza w grupach i u firm
    script: poranek.py
    reasoning_effort: low
    skills: [raport-dnia, lejek]
    enabled_toolsets: [kanban, terminal, file, memory, skills]
    deliver: "@@AGENT_DELIVER@@"     # wątek agenta w grupie Jarvo HQ, bez grupy DM właściciela (build.py)
    paused: true
    paused_reason: "włącza właściciel po przydziale telefonu i liście grup FB (docs/RUNBOOK.md)"
    prompt: >-
      Rutyna poranna Jarodev. Powyżej masz stan lejka i źródeł z poranek.py. Postępuj według skilla `raport-dnia`,
      część „Rano”: jedna karta dnia dla siebie z pętlą w limitach z zrodla.yaml i jedna krótka wiadomość po polsku
      (liczby, szkice czekające na Twoje „tak”, czego brakuje). Niczego nie publikujesz ani nie wysyłasz.
