# jarvo-jarodev: agent biznesowy marki jarodev.pl (klienci na strony i automatyzacje). Tokeny @@...@@ podstawia
# scripts/build.py. Mapy Google na Komputerze Jarva (`komputer: true` we fleet.yaml): te same wejście, twarde zasady
# i ekran jednej sesji naraz co u Jarva (docs/KOMPUTER.md §6), tylko na karcie i w CLI (niżej). Telefon: serwer
# MCP phone z PHONEUSE_ONLY (jeden przydzielony telefon) dopisuje do zainstalowanego configu dopiero
# `jarvo telefon przydziel`, nie ten plik.
model:
  provider: "@@PROVIDER@@"
  default: "@@MODEL@@"

agent:
  reasoning_effort: low
  max_turns: 250

timezone: "@@TIMEZONE@@"

memory:
  memory_enabled: true
  user_profile_enabled: true
  nudge_interval: 12

skills:
  creation_nudge_interval: 20
  write_approval: true          # nowy albo zmieniony skill czeka na zgodę właściciela (docs/RSI.md §R1, poczekalnia.py)

web:
  search_backend: searxng        # natywnie build zdejmuje: autodetekcja wyszukiwarki Hermesa (NATYWNIE.md I14)

# Ekran (computer_use, komputer) tylko w osobnym procesie: na karcie kanbana (pracownik cli) i w `hermes -p
# jarvo-jarodev chat`. Brama Telegrama i czatu HQ to jeden proces dla wszystkich profili, a klucz grupy ekranu
# (JARVO_KOMPUTER_GRUPA) jest na proces: rozmowa Jarodev i rozmowa Jarva dzieliłyby wtedy ekran bez zamka `zajete`
# (docs/KOMPUTER.md §6, §7 „Drugi agent na ekranie”). W rozmowie Mapy idą na kartę dla siebie (kanban).
# Rutyna poranna ma kanban: zakłada kartę dnia (skill raport-dnia); w cronie ekranu nie ma (bez człowieka).
platform_toolsets:
  cli: [terminal, file, web, browser, computer_use, komputer, delegation, memory, skills, todo, session_search]
  telegram: [kanban, terminal, file, web, browser, delegation, memory, skills, todo, session_search, clarify]
  api_server: [kanban, terminal, file, web, browser, delegation, memory, skills, todo, session_search]   # czat Jarvo HQ: jak Telegram, bez clarify (API go nie obsługuje)
  cron: [kanban, terminal, file, memory, skills]

terminal:
  backend: local
  cwd: "@@WORKSPACES_DIR@@/jarvo-jarodev"
  timeout: 600

computer_use:
  permission_mode: standard     # jak u Jarva: bounded wymaga polecenia `serve`, którego bramka nie przepuszcza
  capture_after_mode: ax        # sprawdzenie po działaniu z drzewa dostępności (bez obrazu)
  ax_max_elements: 300
  max_image_dimension: 1456
  cua_telemetry: false

# Stałe zgody na Komputerze Jarva, te same co u Jarva (klucze dokładne): działania w tle i działania wejścia na
# wierzchu. Okno na wierzch zawsze zatwierdza człowiek. Publikację, wysyłkę i płatność zatrzymuje wejście Komputera
# (twarde zasady, zgoda tylko z linii ZGODA WŁAŚCICIELA w karcie), a nie ta lista.
command_allowlist:
  - "cua:click:background"
  - "cua:double_click:background"
  - "cua:right_click:background"
  - "cua:middle_click:background"
  - "cua:drag:background"
  - "cua:scroll:background"
  - "cua:type:background"
  - "cua:key:background"
  - "cua:set_value:background"
  - "cua:focus_app:background"
  - "cua:click:foreground"
  - "cua:double_click:foreground"
  - "cua:right_click:foreground"
  - "cua:middle_click:foreground"
  - "cua:drag:foreground"
  - "cua:scroll:foreground"
  - "cua:type:foreground"
  - "cua:key:foreground"

# Przeglądarka: browser_* przez agent-browser (nakładka Jarva) z Lightpandą; Windows: engine chrome z buildu (C06).
browser:
  backend: "off"
  engine: lightpanda
  inactivity_timeout: 120

stt:
  provider: local_command
  language: pl

delegation:
  model: "@@DELEGATION_MODEL@@"
  provider: "@@PROVIDER@@"
  max_concurrent_children: 2

approvals:
  mode: smart
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  smart_policy: >-
    Always ESCALATE: publishing or posting content, commenting, sending messages, e-mails, SMS or calls to anyone,
    filling in contact forms, unless the kanban card body has a line "ZGODA WŁAŚCICIELA" naming that category;
    logging into any account other than the one already open on the assigned phone or Jarvo's Computer;
    buying or downloading contact databases; scraping; bypassing robots.txt, rate limits, captchas or bot protection.
  deny:
    - "rm -rf /*"
    - "* | sh"
    - "* | bash"

security:
  protected_instruction_files: true

display:
  skin: jarvo
