# Źródła klientów jarodev.pl. Ten plik leży w katalogu roboczym agenta (<dane>/jarvo/workspaces/jarvo-jarodev/zrodla.yaml);
# `lejek.py init` kopiuje ten wzór tylko wtedy, gdy pliku jeszcze nie ma, więc Twoje wpisy przeżywają aktualizacje.
# Grupy na Facebooku i portale podaje właściciel: dopóki listy są puste, agent nie wymyśla grup sam, tylko pyta.

# Grupy na Facebooku, które agent czyta na przydzielonym telefonie (konto właściciela musi być ich członkiem).
# Wpis: {nazwa: "Strony WWW - zlecenia", link: "https://www.facebook.com/groups/…", szukaj: ["strona", "sklep"]}
grupy_fb: []

# Portale ze zleceniami (np. serwisy dla freelancerów), które agent czyta jako zwykły odwiedzający, bez logowania.
# Wpis: {nazwa: "…", link: "https://…", uwagi: "…"}
portale: []

# Mapy Google: miasta i branże, w których agent szuka firm bez strony (Komputer Jarva, ludzkie tempo).
# Wpis: {miasto: "…", branze: ["fryzjer", "mechanik"]}
mapy: []

# Limity dnia (lejek.py licz <rodzaj> --limit N). Wyższe tylko świadomie: konto FB ma wyglądać jak człowiek.
limity:
  fb-grupy: 10          # przejrzane grupy dziennie
  fb-komentarze: 5      # komentarze wysłane dziennie (każdy za „tak” właściciela)
  fb-posty: 1           # własne posty dziennie
  mapy: 25              # sprawdzone firmy z Map dziennie
  audyty: 10            # szybkie audyty stron dziennie

# Retencja RODO dla osób z postów bez kontaktu (lejek.py retencja --dni).
retencja_dni: 90
