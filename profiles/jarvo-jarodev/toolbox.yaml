agent: jarvo-jarodev

# Narzędzia agenta biznesowego jarodev. Skrypty audytu bierze z profili Web i Łowcy (jedno źródło prawdy, wołane
# ścieżką @@REPO_DIR@@ jak indexnow.py u Web), własne skrypty: lejek.py, poranek.py, wygrane.py (biblioteka standardowa).
tools:
  - name: phoneuse-mcp
    source: PHONEUSE (repo właściciela), tools/phone_mcp.py
    license: własny kod właściciela
    version: "serwer MCP stdio, SDK mcp>=2.3,<3"
    install: {method: none, spec: "jarvo telefon on --phoneuse KATALOG, potem jarvo telefon przydziel jarvo-jarodev <telefon> (docs/MOBILE.md)"}
    integration: mcp
    used_by_skills: [fb-grupy, fb-posty, oferta-szkic]
    healthcheck: "jarvo telefon status"
    autonomy: A1
    optional: true
    notes: "Jeden przydzielony telefon z kontem Facebook właściciela: wpis mcp_servers.phone z PHONEUSE_ONLY=<telefon>, więc list_phones pokazuje tylko ten telefon, a inna nazwa to błąd. confirm=true (wysyłka, publikacja) tylko za „tak” właściciela: wtyczka jarvo-zgody (prośba w rozmowie, ZGODA WŁAŚCICIELA w karcie, bez człowieka i pod YOLO blokada)."
  - name: komputer-jarva
    source: Jarvo (infra/komputer, komputer/plugin; docs/KOMPUTER.md)
    license: MIT (kod Jarva); Chromium BSD-3-Clause
    version: "z instalacji (jarvo komputer on)"
    install: {method: none, spec: "jarvo komputer on (właściciel)"}
    integration: plugin
    used_by_skills: [mapy-firmy]
    healthcheck: "jarvo komputer status"
    autonomy: A1
    optional: true
    notes: "Mapy Google w przeglądarce Komputera narzędziem `komputer` (idz → patrz → kroki); ten sam ekran co Jarvo, jedna sesja steruje naraz (odmowa `zajete` = czekaj), twarde zasady wejścia (publikacja, wysyłka, płatność tylko ze zgodą z karty). Bez Places API (decyzja właściciela)."
  - name: seo-check
    source: profiles/jarvo-web/scripts/seo_check.py (Jarvo)
    license: MIT
    version: "repo"
    install: {method: none, spec: "biblioteka standardowa Pythona"}
    integration: skill-script
    used_by_skills: [szybkie-wygrane]
    healthcheck: "python3 @@REPO_DIR@@/profiles/jarvo-web/scripts/seo_check.py --help"
    autonomy: A0
    notes: "Jedna strona firmy: head, OG, treść, robots.txt, sitemap, 404 (kilka zapytań). wygrane.py woła go i układa 3 wygrane."
  - name: lighthouse
    source: https://github.com/GoogleChrome/lighthouse
    license: Apache-2.0
    version: see-infra
    install: {method: npm, spec: lighthouse}
    integration: skill-script
    used_by_skills: [szybkie-wygrane]
    healthcheck: "lighthouse --version"
    autonomy: A0
    optional: true
    notes: "Jeden przebieg mobilny (wydajność i SEO) przez wygrane.py --lighthouse (Chromium i flagi z audit.py Web). Bez Lighthouse audyt idzie bez liczb szybkości, z uwagą w raporcie."
  - {name: indra-ocr, source: https://github.com/datalab-to/indra, license: "Apache-2.0 (kod); modele: zmodyfikowana OpenRAIL-M (do 20 mln USD, bez produktu konkurującego z Datalab)", version: "0.3.2 (modele v3.1.1)", install: {method: image, spec: "venv /opt/jarvo/venvs/ocr (Python 3.12), infra/python/requirements-ocr.txt (sha256, --require-hashes, --no-deps, bez huggingface_hub); modele /opt/jarvo/models/indra-ocr (sha256)"}, integration: skill-script, used_by_skills: [odczyt-ekranu], healthcheck: "python3 @@REPO_DIR@@/shared/skills/odczyt-ekranu/scripts/ocr.py --stan", autonomy: A0, notes: "Wspólny odczyt ekranu (decyzja właściciela 2026-10-17): zrzut ekranu, skan, PDF, klatka filmu → tekst, ramki, --szukaj; bez sieci (modele w obrazie, gniazda zablokowane). Zapas: Tesseract pol+eng."}
