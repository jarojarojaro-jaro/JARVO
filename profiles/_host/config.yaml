# Profil hosta (default, HERMES_HOME: w kontenerze /opt/data, natywnie <dane>): gateway, multipleks profili,
# dispatcher kanbana, trasy. Z Tobą nie rozmawia. Trasy gateway.profile_routes dopisuje scripts/build.py z fleet.yaml
# i zmiennych TELEGRAM_* (DM właściciela → jarvo, wątki grupy "Jarvo HQ" → agenci). W układzie natywnym
# (build.py --uklad natywny) build dopisuje też wtyczkę zgód jarvo-zgody w plugins.enabled,
# security.tirith_enabled, security.allow_lazy_installs i auth.adopt_external_logins: false
# oraz terminal.home_mode: profile i terminal.auto_source_bashrc: false (docs/NATYWNIE.md, sekcja d).

model:                      # nadpisywane przez scripts/build.py: dostawca floty i model `fast`
  provider: openrouter
  default: anthropic/claude-haiku-4.5

gateway:
  multiplex_profiles: true
  profile_routes: []

kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 30
  review_dispatch: true
  notify_in_gateway: true
  auto_subscribe_on_create: true
  failure_limit: 2
  # VPS 8 GB: każdy pracownik to osobny proces Hermesa (~300–400 MB) + ewentualnie przeglądarka.
  # Bez tych kluczy Hermes liczy limit z RAM hosta (8 GB → 8 pracowników), za dużo na ten budżet.
  max_in_progress: 3
  max_in_progress_per_profile: 2

# Wiadomości głosowe z Telegrama transkrybuje gateway: Parakeet przez jarvo-stt (bez faster-whisper).
# Polecenie to HERMES_LOCAL_STT_COMMAND: w kontenerze ENV w infra/Dockerfile, natywnie build/host/srodowisko.json
# z scripts/build.py (pełna ścieżka jarvo-stt, na Windows .exe, z „/” i w cudzysłowie: Hermes dzieli je shlex.split).
stt:
  provider: local_command
  language: pl

# Głos floty (odpowiedzi głosowe na Telegramie, tryb /voice, i narzędzie text_to_speech): lokalny polski
# Matcha-TTS-PL v2 z obrazu przez jarvo-tts, bez sieci i bez klucza. scripts/build.py kopiuje ten blok do
# każdego profilu bez własnego `tts`. Głos żeński: voice: pl-PL-Matcha-Damski. WAV → Opus robi Hermes (dymek głosowy).
# Ścieżka programu to ścieżka obrazu; w układzie natywnym build wpisuje w jej miejsce program floty z instalacji
# ("<program>/bin-floty/jarvo-tts.exe" na Windows), z „/” i w cudzysłowie, a argumenty zostają.
tts:
  provider: matcha
  providers:
    matcha:
      type: command
      command: /opt/jarvo/bin/jarvo-tts --plik {input_path} -o {output_path} --glos {voice}
      voice: pl-PL-Matcha-Meski
      format: wav
      voice_compatible: true
      timeout: 180

platforms:
  telegram:
    reply_to_mode: first

approvals:
  mode: smart
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny

memory:
  memory_enabled: false
  user_profile_enabled: false

platform_toolsets:
  cli: [kanban, file, terminal, skills]
  telegram: [clarify]

# Branding terminala: skórka Jarvo (branding/skin-jarvo.yaml)
display:
  skin: jarvo
