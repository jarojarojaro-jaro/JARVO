# jarvo-mobile: Twórca aplikacji (aplikacje mobilne Expo, audyt mobilny, sklepy). Tokeny @@...@@ podstawia scripts/build.py.
model:
  provider: "@@PROVIDER@@"
  default: "@@MODEL@@"

agent:
  reasoning_effort: low
  max_turns: 300

timezone: "@@TIMEZONE@@"

memory:
  memory_enabled: true
  user_profile_enabled: true
  nudge_interval: 12

skills:
  creation_nudge_interval: 20

web:
  search_backend: searxng

platform_toolsets:
  cli: [terminal, file, web, browser, vision, delegation, memory, skills, todo, session_search]
  telegram: [terminal, file, web, browser, vision, delegation, memory, skills, todo, session_search, clarify]
  api_server: [terminal, file, web, browser, vision, delegation, memory, skills, todo, session_search]   # czat Jarvo HQ: jak Telegram, bez clarify (API go nie obsługuje)
  cron: [terminal, file, web, memory, skills]

terminal:
  backend: local
  cwd: "@@WORKSPACES_DIR@@/jarvo-mobile"
  timeout: 900

# Przeglądarka: browser_* przez agent-browser z Lightpandą; zrzuty przez Chromium z obrazu (jak u Weba).
browser:
  backend: "off"
  engine: lightpanda
  inactivity_timeout: 120

stt:
  provider: local_command
  language: pl

delegation:
  model: "@@DELEGATION_MODEL@@"
  provider: "@@PROVIDER@@"
  max_concurrent_children: 2

approvals:
  mode: smart
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  smart_policy: >-
    Always ESCALATE: anything that touches the owner's Apple, Google Play or Expo accounts (eas submit, eas build
    with auto-submit, eas update to a production channel, fastlane deliver/supply/pilot, altool, App Store Connect
    or Google Play Developer API calls that change data), the wydanie.py subcommands build, testy and karta (they run
    EAS Build, EAS Submit and eas metadata:push on the owner's accounts), utrzymanie.py aktualizacja and
    eas update:rollback / update:republish (they change what users of the store build run), submitting for review, releasing or publishing
    an app, replying to store reviews, buying anything, logging into any website. Never use passwords pasted in chat.
  deny:
    - "*submit-expo-feedback*"        # skille Expo każą wysyłać opinię do Expo: dane projektu klienta nie wychodzą
    - "rm -rf /*"
    - "git push --force*"
    - "* | sh"
    - "* | bash"

security:
  protected_instruction_files: true

display:
  skin: jarvo
