agent: jarvo-mobile

tools:
  - name: itunes-search-api
    source: https://performance-partners.apple.com/search-api (Apple)
    license: dane publiczne (API bez klucza)
    version: "api"
    install: {method: none, spec: "HTTP, bez klucza; ~20 zapytań/min"}
    integration: skill-script
    used_by_skills: [audyt-mobilny]
    healthcheck: "python3 /opt/jarvo/repo/profiles/jarvo-mobile/scripts/audyt_mobilny.py sprawdz"
    autonomy: A0
    optional: true
    notes: "audyt_mobilny.py: lookup po ID i bundleId, wyszukiwanie, kanał RSS opinii; pauza 4 s między zapytaniami (także między procesami)."
  - name: google-play-details
    source: https://play.google.com/store/apps/details (Google)
    license: strona publiczna (robots.txt dopuszcza /store/apps/details)
    version: "html"
    install: {method: none, spec: "HTTP"}
    integration: skill-script
    used_by_skills: [audyt-mobilny]
    healthcheck: "python3 -c \"import urllib.request; urllib.request.urlopen('https://play.google.com/store/apps/details?id=pl.allegro&hl=pl', timeout=20)\""
    autonomy: A0
    optional: true
    notes: "Tylko strona szczegółów (ocena, aktualizacja, Data safety). Wyszukiwarki i opinii Google Play nie pobieramy (robots.txt, regulamin)."
  - name: digital-asset-links-api
    source: https://developers.google.com/digital-asset-links (Google)
    license: API publiczne bez klucza
    version: "v1"
    install: {method: none, spec: "HTTP"}
    integration: skill-script
    used_by_skills: [audyt-mobilny]
    healthcheck: "python3 -c \"import urllib.request; urllib.request.urlopen('https://digitalassetlinks.googleapis.com/v1/statements:list?source.web.site=https://allegro.pl&relation=delegate_permission/common.handle_all_urls', timeout=20)\""
    autonomy: A0
    optional: true
    notes: "Potwierdzenie App Links; kopia AASA z CDN Apple (app-site-association.cdn-apple.com) bez klucza."
  - name: expo-sdk
    source: https://github.com/expo/expo
    license: MIT
    version: "SDK 57 (expo ~57.0.26, react-native 0.86.3)"
    install: {method: npm, spec: "per projekt z szablonu templates/expo-jarvo (npm install + npx expo install)"}
    integration: skill-script
    used_by_skills: [nowa-aplikacja, podglad-aplikacji]
    healthcheck: "node --version && npm --version"
    autonomy: A1
    notes: "aplikacja.py nowa/ustaw/sprawdz/eksport/podglad; Node z obrazu Hermesa (≥ 22.13 wymagane przez SDK 57)."
  - name: expo-doctor
    source: https://github.com/expo/expo/tree/main/packages/expo-doctor
    license: MIT
    version: "1.21.1"
    install: {method: npx, spec: "npx --yes expo-doctor@1.21.1 (pobierany przy pierwszym użyciu)"}
    integration: skill-script
    used_by_skills: [nowa-aplikacja]
    healthcheck: "npm --version"
    autonomy: A0
    optional: true
    notes: "aplikacja.py sprawdz: konfiguracja, zależności, React Native Directory (wymaga sieci; --bez-sieci pomija)."
  - name: eas-cli
    source: https://github.com/expo/eas-cli
    license: MIT
    version: "24.7.0"
    install: {method: npx, spec: "npx --yes eas-cli@24.7.0 (pobierany przy pierwszym użyciu)"}
    integration: skill-script
    used_by_skills: [podglad-aplikacji, wydanie]
    healthcheck: "npm --version"
    autonomy: A1
    optional: true
    notes: "aplikacja.py expo-go: eas init (projekt w organizacji właściciela) i eas update na gałąź podglądu (A1). wydanie.py: eas build (production, --no-wait), build:view, submit (TestFlight, ścieżka wewnętrzna Google jako szkic), metadata:push: A2 z dosłowną zgodą właściciela; token robota EXPO_TOKEN w .env profilu."
  - name: sharp
    source: https://github.com/lovell/sharp
    license: Apache-2.0
    version: see-infra
    install: {method: npm, spec: sharp}
    integration: skill-script
    used_by_skills: [nowa-aplikacja, pakiet-do-sklepow]
    healthcheck: "node -e \"require('sharp')\""
    autonomy: A1
    notes: "ikony.cjs: ikona App Store bez kanału alfa, ikona adaptacyjna Androida (pierwszy plan, tło, monochromatyczna), ekran startowy, favicon. kadry.cjs: zrzuty do sklepów i grafiki Google zapisane bez alfy."
  - name: playwright-core
    source: https://github.com/microsoft/playwright
    license: Apache-2.0
    version: see-infra
    install: {method: npm, spec: playwright-core}
    integration: skill-script
    used_by_skills: [podglad-aplikacji, nowa-aplikacja, pakiet-do-sklepow]
    healthcheck: "node -e \"require('playwright-core')\""
    autonomy: A0
    notes: "zrzuty.cjs: iPhone 17 Pro Max (1320×2868) i Pixel 9, jasny i ciemny; kontrole konsoli, przewijania, celów dotyku i axe-core."
  - name: adb
    source: https://developer.android.com/tools/adb (pakiet Debiana adb)
    license: Apache-2.0
    version: see-infra
    install: {method: apt, spec: adb}
    integration: skill-script
    used_by_skills: [bramka-aplikacji]
    healthcheck: "adb version"
    autonomy: A1
    optional: true
    notes: "urzadzenie.py: telefon testowy floty (jarvo android on: emulator Google przy KVM albo Redroid) w sieci jarvo-net albo telefon / emulator właściciela; port adb nigdy publicznie. Ekran dla właściciela: jarvo_link.py --android."
  - name: github-actions-macos
    source: https://github.com/actions/runner-images (macos-26)
    license: usługa GitHub (minuty macOS)
    version: "macos-26 (Xcode 26.x)"
    install: {method: none, spec: "workflow templates/ci/jarvo-ios.yml w repo aplikacji właściciela"}
    integration: skill-script
    used_by_skills: [bramka-aplikacji]
    healthcheck: "python3 -c \"import urllib.request; urllib.request.urlopen('https://api.github.com/zen', timeout=20)\""
    autonomy: A1
    optional: true
    notes: "ios_ci.py: wypchnięcie na gałąź jarvo/ci, workflow_dispatch, artefakt ze zrzutami i logami; GITHUB_TOKEN fine-grained właściciela."

  - name: tesseract
    source: https://github.com/tesseract-ocr/tesseract
    license: Apache-2.0
    version: see-infra
    install: {method: apt, spec: "tesseract-ocr tesseract-ocr-pol (obraz floty)"}
    integration: skill-script
    used_by_skills: [pakiet-do-sklepow]
    healthcheck: "tesseract --version"
    autonomy: A1
    notes: "sklep_check.py punkt 37: tekst na zrzutach iOS bez nazw innych platform (Apple 2.3.10)."
  - name: eas-metadata-fastlane-layout
    source: https://docs.expo.dev/eas/metadata/ (store.config.json), https://docs.fastlane.tools/actions/supply/ (układ karty Google)
    license: formaty plików (MIT)
    version: "configVersion 0"
    install: {method: none, spec: "pliki w repo aplikacji: store.config.json, out/sklep/google/pl-PL/"}
    integration: skill-script
    used_by_skills: [pakiet-do-sklepow]
    healthcheck: "true"
    autonomy: A1
    notes: "pakiet.py szkic tworzy pliki, sklep_check.py je czyta; wysyłka metadanych (eas metadata:push) dopiero w etapie 5, A2."

sidecars: []
hermes_skills: []
hermes_plugins: []
mcp_servers: []
env_requires: [OPENROUTER_API_KEY]
