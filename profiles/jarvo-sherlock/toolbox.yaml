agent: jarvo-sherlock

tools:
  - name: trafilatura
    source: https://github.com/adbar/trafilatura
    license: Apache-2.0
    version: "2.2.0"
    install: {method: uv-tool-venv, spec: "trafilatura==2.2.0"}
    integration: skill-script
    used_by_skills: [metoda-sherlocka, weryfikacja-faktow]
    healthcheck: "/opt/jarvo/venv/bin/python -c 'import trafilatura'"
    autonomy: A0
  - name: yt-dlp
    source: https://github.com/yt-dlp/yt-dlp
    license: Unlicense
    version: "latest-pinned-in-image"
    install: {method: uv-tool, spec: "yt-dlp"}
    integration: cli
    used_by_skills: [youtube-content]
    healthcheck: "yt-dlp --version"
    autonomy: A0
  - name: docling
    source: https://github.com/docling-project/docling
    license: MIT
    version: "image"
    install: {method: uv-tool, spec: "docling"}
    integration: cli
    used_by_skills: [weryfikacja-faktow]
    healthcheck: "docling --version"
    autonomy: A0
    optional: true           # tylko z JARVO_EXTRAS="docling"
    notes: "Ciężki (modele ML, ~1–2 GB). Instalowany w obrazie tylko z JARVO_EXTRAS=\"docling\"."
  - name: lightpanda
    source: https://github.com/lightpanda-io/browser
    license: AGPL-3.0 (niezmodyfikowana binarka, osobny program)
    version: "0.4.0"
    install: {method: image, spec: "COPY z lightpanda/browser (infra/Dockerfile)"}
    integration: hermes-browser-engine
    used_by_skills: [metoda-sherlocka, blocked-page-recovery]
    healthcheck: "lightpanda version"
    autonomy: A0
    notes: "Silnik browser_* (browser.engine: lightpanda, ~30 MB RAM na sesję). Zrzuty i trudne strony: Hermes sam przełącza na Chromium. Czysty tekst strony bez przeglądarki: `lightpanda fetch --dump markdown <url>`."
  - name: agent-browser
    source: https://github.com/vercel-labs/agent-browser
    license: Apache-2.0
    version: see-infra
    install: {method: npm, spec: agent-browser}
    integration: hermes-browser-driver
    used_by_skills: [metoda-sherlocka, blocked-page-recovery]
    healthcheck: "agent-browser --version"
    autonomy: A0
  - name: exiftool
    source: https://github.com/exiftool/exiftool
    license: GPL-3.0 (CLI, osobny program)
    version: apt
    install: {method: apt, spec: libimage-exiftool-perl}
    integration: cli
    used_by_skills: [weryfikacja-faktow]
    healthcheck: "exiftool -ver"
    autonomy: A0

sidecars:
  - name: searxng
    image: searxng/searxng
    license: AGPL-3.0
    url_env: SEARXNG_URL
    healthcheck: "curl -fsS \"$SEARXNG_URL/search?q=test&format=json\" >/dev/null"

hermes_skills: [blocked-page-recovery, searxng-search, duckduckgo-search, scrapling, arxiv, youtube-content, reddit-reading, rss-feeds, blogwatcher, competitor-news-monitor, domain-intel, osint-investigation]
hermes_plugins: [openalex]   # opcjonalnie: `hermes -p jarvo-sherlock plugins install <nazwa>`
mcp_servers: []
env_requires: [OPENROUTER_API_KEY]
