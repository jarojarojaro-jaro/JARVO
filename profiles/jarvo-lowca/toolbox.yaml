agent: jarvo-lowca

tools:
  - name: krs-api
    source: https://api-krs.ms.gov.pl (Ministerstwo Sprawiedliwości)
    license: dane publiczne (rejestr jawny)
    version: "api"
    install: {method: none, spec: "HTTP, bez klucza"}
    integration: skill-script
    used_by_skills: [sygnaly, kontakt-firmy, monitoring-leadow]
    healthcheck: "python3 -c \"import urllib.request; urllib.request.urlopen('https://api-krs.ms.gov.pl/api/krs/OdpisAktualny/0000019193?rejestr=P&format=json', timeout=20)\""
    autonomy: A0
    optional: true
    notes: "krs.py: odpisy i dzienny biuletyn wpisów. Nazwiska zarządu API maskuje."
  - name: ceidg-api
    source: https://dane.biznes.gov.pl/api/ceidg/v3 (Hurtownia danych CEIDG i Biznes.gov.pl, Ministerstwo Rozwoju i Technologii)
    license: dane publiczne (open data, rejestr jawny)
    version: "api v3"
    install: {method: api, spec: "CEIDG_TOKEN (darmowy token JWT z dane.biznes.gov.pl)"}
    integration: skill-script
    used_by_skills: [sygnaly, kontakt-firmy, kwalifikacja, lista-leadow, monitoring-leadow]
    healthcheck: "python3 /opt/jarvo/repo/profiles/jarvo-lowca/scripts/ceidg.py --help"
    autonomy: A0
    optional: true
    notes: "ceidg.py szukaj/firma: jednoosobowe działalności (KRS = spółki). Limit 1000 zapytań/h, skrypt ≥ 4 s między zapytaniami; 429 = czeka i ponawia, potem kod 3. Token tylko w nagłówku, nigdy w wyjściu. Minimum danych osoby: bez imienia i nazwiska, ulicy, adresu korespondencyjnego; `ceidg.py sprawdz` sprawdza token."
  - name: e-zamowienia-bzp
    source: https://ezamowienia.gov.pl/mo-board/api/v1/notice (Urząd Zamówień Publicznych)
    license: dane publiczne
    version: "api v1"
    install: {method: none, spec: "HTTP, bez klucza"}
    integration: skill-script
    used_by_skills: [sygnaly, monitoring-leadow]
    healthcheck: "python3 /opt/jarvo/repo/profiles/jarvo-lowca/scripts/przetargi.py sprawdz bzp"
    autonomy: A0
    optional: true
    notes: "przetargi.py bzp: ogłoszenia i wyniki ze zwycięzcą. Odcina za serię ciężkich zapytań: pauza 4 s, dzień dzielony na województwa."
  - name: ted-api
    source: https://api.ted.europa.eu/v3 (Urząd Publikacji UE)
    license: dane publiczne (reuse EU)
    version: "v3"
    install: {method: none, spec: "HTTP, bez klucza"}
    integration: skill-script
    used_by_skills: [sygnaly, monitoring-leadow]
    healthcheck: "python3 /opt/jarvo/repo/profiles/jarvo-lowca/scripts/przetargi.py sprawdz ted"
    autonomy: A0
    optional: true
    notes: "przetargi.py ted: ogłoszenia unijne z CPV."
  - name: camoufox
    source: https://github.com/daijro/camoufox
    license: MPL-2.0 (przeglądarka, niezmodyfikowana binarka), MIT (biblioteka camoufox)
    version: "152.0.4-beta.30 (biblioteka 0.5.6)"
    install: {method: binary, spec: "infra/Dockerfile: wydanie v152.0.4-beta.30, SHA-256 amd64 i arm64; camoufox==0.5.6 + playwright==1.62.0 w /opt/jarvo/venv"}
    integration: skill-script
    used_by_skills: [ostrozna-przegladarka, kontakt-firmy, sygnaly, rozpoznanie-zrodla]
    healthcheck: "python3 /opt/jarvo/repo/shared/skills/ostrozna-przegladarka/scripts/ostrozna.py --sprawdz"
    autonomy: A1
    notes: "Zapasowa przeglądarka tylko po odmowie zwykłej (strona.py kod 3, browser_* z 403/429 albo „Human Verification”; nie dla API rejestrów): `ostrozna.py <url>`. Jedna naraz, ~0,8 GB RAM, 20 s odstępu i 30 stron domeny na dobę, robots.txt, bez klikania captchy i logowania; jej odmowa = blokada. Serwisy za Cloudflare zwykle odmawiają dalej."
