# Rutyny Hackera. scripts/build.py zamienia ten plik na cron/jobs.json przez API crona Hermesa (stałe `id`).
# Z dystrybucji zadania instalują się WSTRZYMANE; włączasz je świadomie (`hermes -p jarvo-hacker cron resume <id>`).
# 25.11 właściciel: „ma raportować na temat hackathonów: jest jakiś dostępny, to działamy; potem tylko trackować,
# w którym bierzemy udział”. Codziennie: przegląd nowych hackathonów do bazy, potem raport do wzięcia i nasze starty.

jobs:
  - id: hacker-terminy
    name: "Hacker: raport hackathonów"
    schedule: "30 8 * * *"
    # skrypt odświeża kalendarz i notatkę w Mózgu i daje stan bazy (do wzięcia teraz, nasze starty); model robi
    # przegląd kanałów radaru (nowe hackathony ze stroną zasad i oceną) i pisze raport
    script: raport_rano.py
    skills: [przeglad-hackatonow, ocena-hackatonu]
    deliver: "@@AGENT_ROUTINE_DELIVER@@"
    attach_to_session: true
    prompt: >-
      Raport hackathonów dla właściciela według skilla `przeglad-hackatonow`; powyżej masz stan bazy. Po polsku,
      najwyżej 15 linii, zawsze z raportem (nigdy [SILENT]).
