# Rutyny Hackera. scripts/build.py zamienia ten plik na cron/jobs.json przez API crona Hermesa (stałe `id`).
# Z dystrybucji zadania instalują się WSTRZYMANE; włączasz je świadomie (`hermes -p jarvo-hacker cron resume <id>`).
# 25.11 właściciel: „kalendarz, który trzyma terminy”, a raport codziennie (cisza wyglądała jak awaria).

jobs:
  - id: hacker-terminy
    name: "Hacker: terminy hackathonów"
    schedule: "30 8 * * *"
    # etapy w 72 h (rejestracja, start, zgłoszenie, wyniki, nasze kroki, zamrożenie i gotowe) i 5 następnych,
    # w poniedziałek 14 dni; 0 tokenów; przy okazji odświeża out/KALENDARZ.md, out/hackatony.ics i notatkę w Mózgu
    script: terminy_rano.py
    no_agent: true
    deliver: "@@AGENT_ROUTINE_DELIVER@@"
    attach_to_session: true
