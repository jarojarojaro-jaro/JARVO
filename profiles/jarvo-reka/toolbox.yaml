agent: jarvo-reka

tools:
  - {name: pandoc, source: https://github.com/jgm/pandoc, license: GPL-2.0 (CLI, osobny program), version: "obraz: apt; natywnie 3.12.1", install: {method: apt, spec: "obraz: apt pandoc; natywnie: vendor/natywne.yaml (pandoc, zip lub tar.gz z wydania, sha256)"}, integration: cli, used_by_skills: [dokumenty], healthcheck: "pandoc --version", autonomy: A1, notes: "to_pdf.py i konwertuj.py z pustym --data-dir (bez szablonów i init.lua z katalogu danych pandoca użytkownika)."}
  - {name: ocrmypdf, optional: true, source: https://github.com/ocrmypdf/OCRmyPDF, license: MPL-2.0, version: apt, install: {method: apt, spec: "obraz: apt ocrmypdf tesseract-ocr-pol; natywnie jeszcze nie (E06: venv narzędzi z pikepdf)"}, integration: cli, used_by_skills: [dokumenty], healthcheck: "ocrmypdf --version", autonomy: A1, notes: "Natywnie tekst ze skanu daje odczyt-ekranu (ocr.py)."}
  - {name: chromium-pdf, source: https://www.chromium.org, license: BSD-3-Clause, version: image, install: {method: image, spec: "obraz: chrome-headless-shell z obrazu Hermesa; natywnie: vendor/natywne.yaml (chrome-headless-shell, CHROME_PATH)"}, integration: skill-script, used_by_skills: [dokumenty, zlozenie-pakietu], healthcheck: "\"$CHROME_PATH\" --version", autonomy: A1, notes: "to_pdf.py: pandoc → HTML → PDF; proces tylko na czas konwersji; --no-sandbox tylko w kontenerze, jako root i na Linuksie bez przestrzeni nazw użytkownika."}
  - {name: libreoffice, optional: true, source: https://www.libreoffice.org, license: MPL-2.0, version: apt, install: {method: apt, spec: "obraz: apt libreoffice-*-nogui (JARVO_EXTRAS=office); natywnie: LibreOffice właściciela (Program Files, Aplikacje, /opt) albo JARVO_SOFFICE"}, integration: skill-script, used_by_skills: [dokumenty], healthcheck: "soffice --version", autonomy: A1, notes: "XLSX/PPTX/DOC→PDF; w obrazie tylko z JARVO_EXTRAS=\"office\" (~0,5 GB dysku); natywnie to_pdf.py i konwertuj.py szukają go same (konwertuj.py --formaty: silnik libreoffice)."}
  - {name: qpdf, source: https://github.com/qpdf/qpdf, license: Apache-2.0, version: "obraz: apt; natywnie 12.4.2", install: {method: apt, spec: "obraz: apt qpdf; natywnie: vendor/natywne.yaml (qpdf, zip z wydania, sha256)"}, integration: cli, used_by_skills: [dokumenty], healthcheck: "qpdf --version", autonomy: A1}
  - {name: docling, optional: true, source: https://github.com/docling-project/docling, license: MIT, version: optional, install: {method: uv-tool, spec: docling}, integration: cli, used_by_skills: [dokumenty], healthcheck: "docling --version", autonomy: A0, notes: "JARVO_EXTRAS=\"docling\""}
  - {name: indra-ocr, source: https://github.com/datalab-to/indra, license: "Apache-2.0 (kod); modele: zmodyfikowana OpenRAIL-M (do 20 mln USD, bez produktu konkurującego z Datalab)", version: "0.3.2 (modele v3.1.1)", install: {method: image, spec: "obraz: venv /opt/jarvo/venvs/ocr (Python 3.12), infra/python/requirements-ocr.txt (sha256, --require-hashes, --no-deps, bez huggingface_hub); modele /opt/jarvo/models/indra-ocr (sha256); natywnie: vendor/natywne.yaml (venv ocr, JARVO_OCR_PYTHON; modele indra-ocr w <dane>/jarvo/models, INDRA_OCR_MODEL_DIR)"}, integration: skill-script, used_by_skills: [odczyt-ekranu], healthcheck: "python3 @@REPO_DIR@@/shared/skills/odczyt-ekranu/scripts/ocr.py --stan", autonomy: A0, notes: "Wspólny odczyt ekranu (decyzja właściciela 2026-10-17): zrzut ekranu, skan, PDF, klatka filmu → tekst, ramki, --szukaj; bez sieci (modele w instalacji, gniazda zablokowane). Zapas: Tesseract pol+eng (natywnie z pixi w bin-floty, strony PDF przez pypdfium2)."}

sidecars: []

hermes_skills: [all-bundled]     # pełny katalog wbudowanych skilli Hermesa (brak .no-bundled-skills)
hermes_plugins: [document-reader]
mcp_servers: []                  # np. notion, todoist, google (według narzędzi użytkownika, po konfiguracji)
env_requires: [OPENROUTER_API_KEY]
