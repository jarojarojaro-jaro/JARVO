agent: jarvo-reka

tools:
  - {name: pandoc, source: https://github.com/jgm/pandoc, license: GPL-2.0 (CLI, osobny program), version: apt, install: {method: apt, spec: pandoc}, integration: cli, used_by_skills: [dokumenty], healthcheck: "pandoc --version", autonomy: A1}
  - {name: ocrmypdf, source: https://github.com/ocrmypdf/OCRmyPDF, license: MPL-2.0, version: apt, install: {method: apt, spec: "ocrmypdf tesseract-ocr-pol"}, integration: cli, used_by_skills: [dokumenty], healthcheck: "ocrmypdf --version", autonomy: A1}
  - {name: chromium-pdf, source: https://www.chromium.org, license: BSD-3-Clause, version: image, install: {method: image, spec: "chrome-headless-shell z obrazu Hermesa"}, integration: skill-script, used_by_skills: [dokumenty, zlozenie-pakietu], healthcheck: "chromium --version", autonomy: A1, notes: "to_pdf.py: pandoc → HTML → PDF; proces tylko na czas konwersji."}
  - {name: libreoffice, optional: true, source: https://www.libreoffice.org, license: MPL-2.0, version: apt, install: {method: apt, spec: "libreoffice-*-nogui"}, integration: skill-script, used_by_skills: [dokumenty], healthcheck: "soffice --version", autonomy: A1, notes: "XLSX/PPTX/DOC→PDF; tylko z JARVO_EXTRAS=\"office\" (~0,5 GB dysku)."}
  - {name: qpdf, source: https://github.com/qpdf/qpdf, license: Apache-2.0, version: apt, install: {method: apt, spec: qpdf}, integration: cli, used_by_skills: [dokumenty], healthcheck: "qpdf --version", autonomy: A1}
  - {name: docling, optional: true, source: https://github.com/docling-project/docling, license: MIT, version: optional, install: {method: uv-tool, spec: docling}, integration: cli, used_by_skills: [dokumenty], healthcheck: "docling --version", autonomy: A0, notes: "JARVO_EXTRAS=\"docling\""}
  - {name: indra-ocr, source: https://github.com/datalab-to/indra, license: "Apache-2.0 (kod); modele: zmodyfikowana OpenRAIL-M (do 20 mln USD, bez produktu konkurującego z Datalab)", version: "0.3.2 (modele v3.1.1)", install: {method: image, spec: "venv /opt/jarvo/venvs/ocr (Python 3.12), infra/python/requirements-ocr.txt (sha256, --require-hashes, --no-deps, bez huggingface_hub); modele /opt/jarvo/models/indra-ocr (sha256)"}, integration: skill-script, used_by_skills: [odczyt-ekranu], healthcheck: "python3 @@REPO_DIR@@/shared/skills/odczyt-ekranu/scripts/ocr.py --stan", autonomy: A0, notes: "Wspólny odczyt ekranu (decyzja właściciela 2026-10-17): zrzut ekranu, skan, PDF, klatka filmu → tekst, ramki, --szukaj; bez sieci (modele w obrazie, gniazda zablokowane). Zapas: Tesseract pol+eng."}

sidecars: []

hermes_skills: [all-bundled]     # pełny katalog wbudowanych skilli Hermesa (brak .no-bundled-skills)
hermes_plugins: [document-reader]
mcp_servers: []                  # np. notion, todoist, google (według narzędzi użytkownika, po konfiguracji)
env_requires: [OPENROUTER_API_KEY]
