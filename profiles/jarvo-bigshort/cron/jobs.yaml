# Rutyny Bigshorta. scripts/build.py zamienia ten plik na cron/jobs.json przez API crona Hermesa (stałe `id`).
# Z dystrybucji zadania instalują się WSTRZYMANE; włączasz je świadomie (`hermes -p jarvo-bigshort cron resume <id>`).
# 25.11 właściciel: Bigshort szuka pieniędzy dla Jarvo albo Enigmy; raport dnia = okazje do wzięcia i nasze aplikacje,
# a skrypt przy okazji odświeża kalendarz i notatkę w Mózgu.

jobs:
  - id: bigshort-terminy
    name: "Bigshort: raport finansowania"
    schedule: "35 8 * * *"
    # najlepsze 3 okazje do wzięcia dla każdego projektu i nasze aplikacje w toku; 0 tokenów; odświeża
    # out/KALENDARZ.md, out/finansowanie.ics i notatkę „kalendarz finansowania” w Mózgu
    script: raport_rano.py
    no_agent: true
    deliver: "@@AGENT_ROUTINE_DELIVER@@"
    attach_to_session: true
