# Flota Jarvo na VPS. Uruchamiane przez scripts/deploy.sh z katalogu /srv/jarvo/repo:
#   docker compose -f infra/docker-compose.yml --env-file /srv/jarvo/compose/.env up -d
#
# Budżet: VPS 8 GB RAM (4 vCPU). Limity niżej sumują się do ~5,5 GB (+0,4 GB z profilem monitoring);
# reszta zostaje dla systemu i cache dysku. Limity to sufity, nie rezerwacje: w spoczynku flota bierze ~1 GB.
#
# Porty: nic nie jest publikowane publicznie. Dashboard/Desktop (9119), podgląd stron HQ (9120), ekran telefonu
# testowego (9122, proxy z tokenem) i panele monitoringu wiążemy do JARVO_BIND_IP (domyślnie 127.0.0.1; ustaw IP Tailscale, żeby sięgać z laptopa/telefonu).
# Telegram działa bez portów (long polling).
#
# Profile compose:
#   (domyślny)  hermes + searxng + valkey
#   monitoring  uptime-kuma + beszel (hub + agent)
#   android     telefon testowy Twórcy aplikacji na serwerze bez KVM: Redroid (Android 14 w kontenerze, moduł binder
#               w jądrze hosta) + ws-scrcpy (ekran w przeglądarce); ~2,3 GB RAM w pracy
#   android-kvm to samo z oficjalnym emulatorem Androida 13 (z usługami Google) tam, gdzie jest /dev/kvm (serwer
#               z KVM, WSL2 z Docker Engine); ~4 GB RAM. Oba włącza `jarvo android on` (wybiera sam), adres ten sam.
#   komputer    Komputer Jarva (docs/KOMPUTER.md): pulpit Linux z Chromium i sterownikiem ekranu dla computer use,
#               bez portów i bez kluczy floty; ~0,3 GB w spoczynku, do 2 GB w pracy. Włącza `jarvo komputer on`.
#
# Obrazy usług przypięte do wersji i digestu (tag@sha256): wdrożenie bierze zawsze ten sam obraz, a nowa wersja
# przychodzi z aktualizacją repo po przeglądzie (docs/SOURCES.md, vendor/zrodla.yaml). Własny obraz: IMAGE_*
# w compose/.env.

name: jarvo

x-restart: &restart
  restart: unless-stopped
  # logi z rotacją (do 3 × 10 MB na kontener, kompresja): domyślny json-file rośnie bez końca i zapycha dysk
  # VPS-a i maszyny wirtualnej Dockera na Macu; docker logs i jarvo logs działają tak samo
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  hermes:
    <<: *restart
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7}
        JARVO_EXTRAS: ${JARVO_EXTRAS:-}
    image: jarvo-hermes:local
    container_name: jarvo-hermes
    command: gateway run
    environment:
      HERMES_DASHBOARD: "1"
      # Dashboard na adresie innym niż loopback wymaga uwierzytelniania (inaczej Hermes go nie uruchomi).
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${DASHBOARD_USER:-jarvo}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_PASSWORD:?ustaw DASHBOARD_PASSWORD w compose/.env}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${DASHBOARD_SESSION_SECRET:-}
      TZ: ${TZ:-Europe/Warsaw}
      HERMES_TIMEZONE: ${TZ:-Europe/Warsaw}
      SEARXNG_URL: http://searxng:8080
      # adres serwera podglądu („▶ Odpal”, linki agentów z scripts/jarvo_link.py) widziany z przeglądarki
      JARVO_PREVIEW_URL: http://${JARVO_BIND_IP:-127.0.0.1}:9120
      # telefon testowy (profil android): adb dla Twórcy aplikacji i proxy ekranu ws-scrcpy za linkiem z tokenem
      JARVO_ANDROID_ADB: jarvo-android:5555
      JARVO_ANDROID_SCREEN_UPSTREAM: jarvo-android-ekran:8000
      JARVO_ANDROID_SCREEN_URL: http://${JARVO_BIND_IP:-127.0.0.1}:9122
      # dodatki także w działającym kontenerze: „lemo” (sample, głos Kokoro) instaluje narzedzia.py w czasie pracy
      JARVO_EXTRAS: ${JARVO_EXTRAS:-}
      # tylko piaskownica i testy na żywo (scripts/jarvo-e2e.sh): trasy testowe wtyczki jarvo-hq, np. POST /csrf-proba
      JARVO_E2E: ${JARVO_E2E:-}
      # computer_use: sterownik ekranu tylko przez bramkę Jarva (bez pobierania i aktualizacji w locie, docs/KOMPUTER.md)
      HERMES_CUA_DRIVER_CMD: /opt/jarvo/repo/komputer/jarvo_cua.py
    volumes:
      # macOS (i JARVO_VOLUMES=1): wolumeny Dockera zamiast katalogów hosta, bo maszyna wirtualna Dockera
      # nie odda kontenerowi (uid 10000) plików hosta; local-up.sh ustawia JARVO_VOL_* i JARVO_BUILD=jarvo-build
      - ${JARVO_VOL_HERMES:-${JARVO_DATA:-/srv/jarvo/data}/hermes}:/opt/data
      - ${JARVO_REPO:-/srv/jarvo/repo}:/opt/jarvo/repo:ro
      - ${JARVO_BUILD:-/srv/jarvo/build}:/opt/jarvo/build:ro
      - ${JARVO_SECRETS:-/srv/jarvo/secrets}:/opt/jarvo/secrets:ro
      # gniazda Komputera Jarva (ekran RFB, kanał sterownika); pusty wolumen, gdy Komputer jest wyłączony
      - komputer-gniazda:/opt/jarvo/komputer
    ports:
      - "${JARVO_BIND_IP:-127.0.0.1}:9119:9119"     # dashboard + Hermes Desktop (Remote Gateway)
      - "${JARVO_BIND_IP:-127.0.0.1}:9120:9120"     # Jarvo HQ „Odpal”: podgląd stron agentów (link z tokenem)
      - "${JARVO_BIND_IP:-127.0.0.1}:9122:9122"     # ekran telefonu testowego (proxy ws-scrcpy, link z tokenem)
    depends_on:
      searxng: {condition: service_started}
    shm_size: "512mb"                                # jedna Chromium naraz (Lighthouse, PDF, zrzuty)
    deploy:
      resources:
        limits:
          # gateway + dashboard + ≤ 3 pracowników kanbana + przeglądarka + chwilowo STT (~1,2 GB)
          memory: ${HERMES_MEM_LIMIT:-5g}
          cpus: "${HERMES_CPUS:-4}"
    networks: [jarvo-net]

  searxng:
    <<: *restart
    image: ${IMAGE_SEARXNG:-searxng/searxng:2026.10.19-81371861f@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271}
    container_name: jarvo-searxng
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      GRANIAN_HOST: 0.0.0.0        # domyślne "::" wywraca serwer na hostach bez IPv6
      SEARXNG_SECRET: ${SEARXNG_SECRET:?ustaw SEARXNG_SECRET w compose/.env}
      SEARXNG_REDIS_URL: redis://valkey:6379/0
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    depends_on: [valkey]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    deploy:
      resources:
        limits: {memory: 384m}
    networks: [jarvo-net]

  valkey:
    <<: *restart
    image: ${IMAGE_VALKEY:-valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507}
    container_name: jarvo-valkey
    command: valkey-server --save 30 1 --loglevel warning --maxmemory 48mb --maxmemory-policy allkeys-lru
    volumes:
      - ${JARVO_VOL_VALKEY:-${JARVO_DATA:-/srv/jarvo/data}/valkey}:/data
    deploy:
      resources:
        limits: {memory: 96m}
    networks: [jarvo-net]

  uptime-kuma:
    <<: *restart
    profiles: [monitoring]
    image: ${IMAGE_UPTIME_KUMA:-louislam/uptime-kuma:2.5.6@sha256:9912da7d7d9b6ddc0c2d904beb84d24689c1ed9c33b81419eb9008663a92a329}
    container_name: jarvo-uptime-kuma
    volumes:
      - ${JARVO_DATA:-/srv/jarvo/data}/uptime-kuma:/app/data
    ports:
      - "${JARVO_BIND_IP:-127.0.0.1}:3001:3001"
    deploy:
      resources:
        limits: {memory: 256m}
    networks: [jarvo-net]

  beszel:
    <<: *restart
    profiles: [monitoring]
    image: ${IMAGE_BESZEL:-henrygd/beszel:0.21.0@sha256:6b39a8b64f9b15d00a25e7683e31a93c46161182a54f62713525107064e10599}
    container_name: jarvo-beszel
    volumes:
      - ${JARVO_DATA:-/srv/jarvo/data}/beszel:/beszel_data
      - beszel-gniazdo:/beszel_socket                # agent z tego hosta: gniazdo unix, nie port
    ports:
      - "${JARVO_BIND_IP:-127.0.0.1}:8090:8090"
    deploy:
      resources:
        limits: {memory: 128m}
    networks: [jarvo-net]

  beszel-agent:
    <<: *restart
    profiles: [monitoring]
    image: ${IMAGE_BESZEL_AGENT:-henrygd/beszel-agent:0.21.0@sha256:f27b1aa2c68404bc5b9e1a2ab36653bd9b4ee14f6299862f09cd5051a4134767}
    container_name: jarvo-beszel-agent
    network_mode: host                               # statystyki sieci i dysków hosta; portu nie otwiera
    volumes:
      - beszel-gniazdo:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # gniazdo unix we wspólnym wolumenie z hubem (wzór Beszela same-system) zamiast portu 45876 na wszystkich
      # interfejsach hosta; w panelu system dodajemy z hostem /beszel_socket/beszel.sock
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_AGENT_KEY:-}
      # bez cogodzinnego pytania rejestrów o każdy obraz bez digestu (także lokalne jarvo-*:local do Docker Huba)
      DOCKER_IMAGE_CHECK: "false"
    deploy:
      resources:
        limits: {memory: 64m}

  # Telefon testowy: Android 14 w kontenerze (Redroid, Apache-2.0). Bez portów: adb tylko w sieci floty
  # (jarvo-android:5555). privileged, bo Android montuje własne systemy plików i potrzebuje urządzeń binder hosta.
  android:
    <<: *restart
    profiles: [android]
    image: ${IMAGE_REDROID:-redroid/redroid:14.0.0_64only-240527@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa}
    container_name: jarvo-android
    privileged: true
    command:
      - androidboot.redroid_width=1080
      - androidboot.redroid_height=2340
      - androidboot.redroid_dpi=420
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=1
    volumes:
      - ${JARVO_DATA:-/srv/jarvo/data}/android:/data
    deploy:
      resources:
        limits:
          memory: ${ANDROID_MEM_LIMIT:-2g}
          cpus: "${ANDROID_CPUS:-2}"
    networks: [jarvo-net]

  # Ten sam telefon testowy jako oficjalny emulator Google (AVD API 33 google_apis, obraz docker-android, MIT) dla maszyn
  # z KVM. Ta sama nazwa w sieci floty (jarvo-android:5555), więc agent i ekran nie wiedzą, który wariant działa.
  android-emulator:
    <<: *restart
    profiles: [android-kvm]
    image: ${IMAGE_ANDROID_EMULATOR:-halimqarroum/docker-android:api-33@sha256:0804f0c30234db0fb711910c569f13312bc3cfa354cb66c8e0db6a4e66edfb95}
    container_name: jarvo-android
    devices: [/dev/kvm]
    environment:
      MEMORY: ${ANDROID_EMU_MEMORY:-3072}
      CORES: ${ANDROID_CPUS:-2}
      # adb bez klucza: obraz ma stałą parę kluczy z publicznego repo, więc chroni tylko sieć floty (docs/MOBILE.md)
      SKIP_AUTH: "true"
      EXTRA_FLAGS: "-no-metrics"                     # bez statystyk użycia emulatora (jak w przykładzie docker-android)
    volumes:
      - ${JARVO_DATA:-/srv/jarvo/data}/android-emulator:/data
    deploy:
      resources:
        limits:
          memory: ${ANDROID_EMU_MEM_LIMIT:-4g}
          cpus: "${ANDROID_CPUS:-2}"
    networks: [jarvo-net]

  # Ekran telefonu w przeglądarce (ws-scrcpy, MIT, przypięty commit). Bez logowania, więc bez portów: właściciel
  # wchodzi przez proxy w jarvo-hermes (:9122) z linku z tokenem.
  android-ekran:
    <<: *restart
    profiles: [android, android-kvm]
    build:
      context: ./android
      dockerfile: Dockerfile.ws-scrcpy
    image: jarvo-ws-scrcpy:local
    container_name: jarvo-android-ekran
    deploy:
      resources:
        limits: {memory: 256m}
    networks: [jarvo-net]

  # Komputer Jarva (docs/KOMPUTER.md): pulpit, na którym agent klika i pisze. Bez portów, bez kluczy floty i poza siecią
  # floty: jarvo-hermes rozmawia z nim przez gniazda unix we wspólnym wolumenie (tu /run/jarvo-komputer, w hermesie
  # /opt/jarvo/komputer). start.sh blokuje ruch do sieci lokalnej, adresów chmury i hosta (zostaje internet) i bez
  # działającego filtra nie startuje; potem wszystko na ekranie działa jako użytkownik pulpit, bez nowych uprawnień.
  komputer:
    <<: *restart
    profiles: [komputer]
    build:
      context: ./komputer
      args:
        # tydzień roku (deploy.sh, `jarvo komputer on`): co tydzień świeże pakiety Debiana i Chromium
        KOMPUTER_POPRAWKI: ${KOMPUTER_POPRAWKI:-0}
    image: jarvo-komputer:local
    container_name: jarvo-komputer
    hostname: komputer
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      KOMPUTER_EKRAN: ${KOMPUTER_EKRAN:-1440x900}
      # publiczne adresy hosta (VPS), których Komputer też nie może odpytać; uzupełnia `jarvo komputer on` i deploy.sh
      KOMPUTER_BLOKADA: ${KOMPUTER_BLOKADA:-}
    volumes:
      - komputer-gniazda:/run/jarvo-komputer
      - komputer-dom:/home                           # stan przeglądarki; `jarvo komputer wyczysc` kasuje
    # filtr ruchu (NET_ADMIN, zdejmowany zaraz po ustawieniu), katalogi i zrzucenie uprawnień do użytkownika pulpit
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_ADMIN, SETGID, SETPCAP, SETUID]
    security_opt: [no-new-privileges:true]
    shm_size: "1gb"                                  # Chromium
    deploy:
      resources:
        limits:
          memory: ${KOMPUTER_MEM_LIMIT:-2g}
          cpus: "${KOMPUTER_CPUS:-2}"
          pids: 2048
    networks: [jarvo-komputer-net]

networks:
  jarvo-net:
    driver: bridge
  # tylko wyjście do internetu (filtr w start.sh); bez trasy do jarvo-net
  jarvo-komputer-net:
    driver: bridge

# używane tylko, gdy JARVO_VOL_* / JARVO_BUILD wskazują te nazwy (macOS); stałe nazwy bez prefiksu projektu
volumes:
  jarvo-hermes-data: {name: jarvo-hermes-data}
  jarvo-valkey-data: {name: jarvo-valkey-data}
  jarvo-build: {name: jarvo-build}
  # Komputer Jarva: gniazda (wspólne z jarvo-hermes) i katalogi domowe pulpitu na każdym systemie
  komputer-gniazda: {name: jarvo-komputer-gniazda}
  komputer-dom: {name: jarvo-komputer-dom}
  # Beszel: gniazdo agenta wspólne z hubem
  beszel-gniazdo: {name: jarvo-beszel-gniazdo}
