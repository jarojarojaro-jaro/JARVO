# Motyw „Fosfor” dashboardu TARS: terminal CRT z 1982. Cały wygląd liczy się z JEDNEGO koloru.
# Każda pozycja to osobny motyw w przełączniku motywów (lewy dolny róg dashboardu).
# Własny kolor: dopisz linię i wdroż (bash scripts/deploy.sh --no-pull). `default` = motyw na start.
default: fosfor
themes:
  - {name: fosfor,           label: "Fosfor · błękit",   color: "#89cff0"}
  - {name: fosfor-bursztyn,  label: "Fosfor · bursztyn", color: "#ffb000"}
  - {name: fosfor-zielen,    label: "Fosfor · zieleń",   color: "#41ff7a"}
  - {name: fosfor-biel,      label: "Fosfor · biel",     color: "#eef3ff"}
