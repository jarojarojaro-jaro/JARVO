[pytest]
# Katalogi tmp_path zostają tylko po nieudanych testach i tylko z ostatniego biegu: pełny zestaw zostawia w /tmp
# ~1 GB i ~200 tys. plików, a domyślnie pytest trzyma trzy biegi. Przy kilku biegach naraz (agenci na jednym
# serwerze) zapełniało to i-węzły tmpfs /tmp i każdy test dostawał ENOSPC.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
