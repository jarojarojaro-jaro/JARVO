    kiedy: przy-uzyciu
    rola: "animacje matematyczne Wideografa: ManimGX 0.1.1"
    pobranie_mb: {windows-x64: 85, windows-arm64: 85, macos-arm64: 64, linux-x64: 109, linux-arm64: 104}
    venv_mb: 227
  claude-seo:
    python: python312
    lock: infra/python/natywne/claude-seo.lock
    kiedy: instalacja
