# Narzędzia instalacji natywnej (docs/NATYWNIE.md, c3 i L03): jedna wersja na narzędzie i plik dla każdej platformy.
#
# Każde narzędzie przechodzi przegląd z docs/SOURCES.md i ma wpis w vendor/zrodla.yaml (`zrodlo`). Plik dla nowej
# platformy to nowy artefakt: przegląd obejmuje też jego. Bez „latest”: dokładny adres, sha256 i rozmiar.
# Z tego pliku `scripts/natywne.py generuj` robi vendor/natywne.lock.json, który czyta instalator (sama biblioteka
# standardowa, bez YAML); validate.py pilnuje, że lock jest aktualny i że każdy wpis jest kompletny.
#
# platformy: windows-x64, windows-arm64, macos-arm64, linux-x64, linux-arm64 (macOS Intel nie jest wspierany, I06)
# pliki.<platforma>: url (https), sha256, rozmiar (B), format (zip | tar.gz | tar.xz | tar.bz2 | plik),
#   usun_poziom (ile katalogów zdjąć z początku ścieżek w archiwum), bin (katalogi do PATH procesów Jarva,
#   względem katalogu narzędzia), env (zmienne procesów Jarva; {katalog} = katalog narzędzia)
#   albo `brak: <powód>` (np. brak wydania na tę platformę) i opcjonalnie `zamiast: <inne narzędzie>`.
# kiedy: instalacja (domyślnie) | przy-uzyciu (pobierane leniwie, z paskiem i pytaniem) | dodatek (na życzenie)

