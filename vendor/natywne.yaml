# Venvy Jarva (P01, P03, I31; przegląd 2026-10-24): locki z `uv pip compile --universal --generate-hashes` na uv 0.12.13,
# koła z PyPI dla windows-x64 (windows-arm64 = te same koła x64, I27), macos-arm64 (koła od macOS 14.0) i linux x64
# i arm64 (manylinux_2_28, glibc >= 2.28); każde koło dla 4 platform policzone też strumieniowo. Locki OCR, CAD
# i ManimGX to pliki obrazu (kompletne dla 4 platform), nowe locki i ich wejścia są w infra/python/natywne/.
# pobranie_mb = suma kół z locka dla platformy; venv_mb zmierzone na Windows 11 x64 (docling tylko na sucho).
venvy:
  narzedzia:
    python: python312
    lock: infra/python/natywne/narzedzia.lock
    kiedy: instalacja
    rola: "venv narzędzi floty: trafilatura, yt-dlp, onnx-asr + onnxruntime 1.29.0 (jarvo-stt), misaki + spaCy 3.8.16 z en_core_web_sm 3.8.0, espeakng-loader + phonemizer-fork (jarvo-tts), num2words, camoufox + Playwright 1.62, pikepdf 10.17.0 + Pillow 12.3.0 + pillow-heif 1.5.0 + pypdfium2 5.14.0 (konwertuj.py: mniejszy PDF, zdjęcia, HEIC, strony PDF)"
    bez: [docopt]
    pobranie_mb: {windows-x64: 180, windows-arm64: 180, macos-arm64: 178, linux-x64: 233, linux-arm64: 220}
    venv_mb: 646
  ocr:
    python: python312
    lock: infra/python/requirements-ocr.txt
    kiedy: instalacja
    rola: "odczyt ekranu: Indra OCR 0.3.2, onnxruntime 1.31.0, opencv-python-headless 5.0.0.93, pypdfium2 5.14.0"
    bez: [huggingface-hub]
    pobranie_mb: {windows-x64: 76, windows-arm64: 76, macos-arm64: 79, linux-x64: 106, linux-arm64: 81}
    venv_mb: 227
