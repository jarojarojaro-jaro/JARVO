  # docling: wariant CPU (decyzja właściciela otwarta). torch i torchvision są w locku z sumami z indeksu PyTorch CPU
  # (download.pytorch.org/whl/cpu; na macOS inne pliki niż w PyPI), więc instalacja działa tylko z
