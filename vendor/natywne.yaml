# Narzędzia instalacji natywnej (docs/NATYWNIE.md, c3 i L03): jedna wersja na narzędzie i plik dla każdej platformy.
#
# Każde narzędzie przechodzi przegląd z docs/SOURCES.md i ma wpis w vendor/zrodla.yaml (`zrodlo`). Plik dla nowej
# platformy to nowy artefakt: przegląd obejmuje też jego. Bez „latest”: dokładny adres, sha256 i rozmiar.
# Z tego pliku `scripts/natywne.py generuj` robi vendor/natywne.lock.json, który czyta instalator (sama biblioteka
# standardowa, bez YAML); `scripts/natywne.py sprawdz` i tests/test_natywne.py pilnują, że lock jest aktualny i że
# każdy wpis jest kompletny. Przegląd wpisów z etapu E2: 2026-10-24 (docs/SOURCES.md, docs/TOOLBOX.md).
#
# platformy: windows-x64, windows-arm64, macos-arm64, linux-x64, linux-arm64 (macOS Intel nie jest wspierany, I06).
#   Windows arm64 bierze pliki x64 w emulacji (tylko Windows 11, I27), gdy nie ma natywnych albo brakuje im funkcji.
#   macOS: minimum 15. pandoc 3.12.1 i qpdf 12.4.2 mają w LC_BUILD_VERSION minos 15.0, Lightpanda 1.0.0 minos 14.8.9.
# pliki.<platforma>: url (https), sha256, rozmiar (B), format (zip | tar.gz | tar.xz | tar.bz2 | plik),
#   usun_poziom (ile katalogów zdjąć z początku ścieżek w archiwum), bin (katalogi do PATH procesów Jarva,
#   względem katalogu narzędzia), env (zmienne procesów Jarva; {katalog} = katalog narzędzia),
#   nazwa_pliku (format plik: pod tą nazwą plik ląduje w katalogu narzędzia; domyślnie końcówka adresu),
#   usun (ścieżki usuwane po rozpakowaniu: zbędne programy), zmien_nazwe ({stara: nowa} po rozpakowaniu)
#   albo `brak: <powód>` (np. brak wydania na tę platformę) i opcjonalnie `zamiast: <inne narzędzie>`.
#   Dowiązania z archiwów: na POSIX zostają dowiązaniami (tylko w obrębie katalogu narzędzia), na Windows twarde
#   z tar są rozpakowane, a symboliczne zastępuje kopia celu (jarvo/pobieracz.py).
# kiedy: instalacja (domyślnie) | przy-uzyciu (pobierane leniwie, z paskiem i pytaniem) | dodatek (na życzenie)
#
# modele.<nazwa>: pliki niezależne od platformy (wagi, słowniki) do <dane>/jarvo/models/<katalog>: zrodlo, rewizja (pełny
#   commit repo modelu, nigdy tag), licencja, rola, kiedy, katalog, pliki: lista {cel (ścieżka względna w katalogu
#   modelu), url (https, z rewizją w adresie), sha256, rozmiar}.
#
# venvy.<nazwa>: venv Pythona z locka z sumami (c3, krok 6): python (wpis z sekcji narzedzia), lock (plik w
#   infra/python/, każde wymaganie z --hash), kiedy, rola, bez (paczki celowo pominięte: `uv pip check` je zgłosi),
#   pobranie_mb (koła dla platformy), venv_mb (zmierzone na Windows 11 x64), torch_backend (cpu: instalator dodaje
#   `--torch-backend cpu`, torch z indeksu PyTorch, sumy w locku). Instalacja:
#     uv venv --no-config --python <python312|python313> <program>/venvs/<nazwa>-<12 znaków sha256 locka>
#     uv pip install --no-config --no-deps --require-hashes --only-binary :all: --compile-bytecode -r <lock>
#   (Windows: UV_LINK_MODE=copy). Lock z sumą pliku i liczbą paczek trafia do natywne.lock.json.

