  # HERMES_GIT_BASH_PATH, a git przez cmd/ w PATH. W archiwum są twarde dowiązania (92 w x64, 90 w arm64, m.in.
  # ucrt64/libexec/git-core/git-remote-https.exe): pobieracz je rozpakowuje, inaczej git nie zna https; 5 dowiązań
  # symbolicznych do /proc (dev/fd, dev/std*, etc/mtab) pomija, bo te ścieżki daje runtime MSYS2.
  # GIT_CONFIG_NOSYSTEM=1 pomija etc/gitconfig paczki: core.autocrlf=true (CRLF psuje skrypty .sh w Git Bash)
