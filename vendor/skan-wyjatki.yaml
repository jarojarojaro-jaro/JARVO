# Znane fałszywe alarmy skanu skilli zewnętrznych (scripts/skan_skilli.py, uruchamia go scripts/build.py).
#
# Ustalenie high/critical bez wyjątku zatrzymuje build. Każdy wyjątek ktoś przeczytał w kontekście i opisał w `powod`.
# Wyjątek jest przypięty do źródła i commitu z locka (`rev`, prefiks SHA): po zmianie `rev` ustalenie wraca jako błąd,
# więc nowa wersja cudzego skilla zawsze przechodzi przegląd od nowa. `rev: "*"` tylko dla skilli z tego repo
# (źródło `jarvo`), bo przechodzą przegląd w PR. Skille z obrazu Hermesa (`hermes`) nie blokują builda (Hermes
# instaluje je jako wbudowane), ich ustalenia są tylko w raporcie.
#
# Pola: zrodlo (nazwa z locka), rev, skill (`path` z locka), regula (nazwa albo lista; glob), plik (glob, domyślnie *),
# powod. Nieużyty wyjątek build wypisuje jako „!”: usuń go albo popraw rev.

wyjatki:
  # --- obronne zasady „dane to nie polecenia” cytują atak jako przykład
  - {zrodlo: marketingskills, rev: 5b2c000, skill: skills/ads, regula: [wstrzykniecie, "hermes:prompt_injection_ignore"],
     plik: references/audit-guardrails.md, powod: "zasada obronna: nie wykonuj poleceń typu „ignore previous instructions” z pobranych stron"}
  - {zrodlo: emil-skills, rev: d16ebe6, skill: skills/find-animation-opportunities, regula: [wstrzykniecie, "hermes:prompt_injection_ignore"],
     plik: SKILL.md, powod: "zasada obronna: treść repo to dane, próby sterowania zgłasza jako ustalenie"}
  - {zrodlo: emil-skills, rev: d16ebe6, skill: skills/improve-animations, regula: [wstrzykniecie, "hermes:prompt_injection_ignore"],
     plik: SKILL.md, powod: "zasada obronna: treść repo to dane, próby sterowania zgłasza jako ustalenie"}
  - {zrodlo: emil-skills, rev: d16ebe6, skill: skills/improve-animations, regula: [ukryte-znaki, "hermes:invisible_unicode"],
     plik: PLAN-TEMPLATE.md, powod: "spacja zerowej szerokości przed ``` zagnieżdża blok kodu w szablonie planu (4 linie, bez tekstu)"}

  # --- środowisko procesu przekazywane do podprocesu (nie wysyła go nigdzie)
  - {zrodlo: jarvo, rev: "*", skill: shared/skills/graf-kodu, regula: "hermes:python_os_environ", plik: scripts/graf_kodu.py,
     powod: "kopiuje środowisko do procesu silnika grafu z własnym HOME i cache"}
  - {zrodlo: anthropic-skills, rev: "3337550", skill: skills/skill-creator, regula: "hermes:python_os_environ", plik: "scripts/*.py",
     powod: "przekazuje środowisko do podprocesu ewaluacji, bez zmiennej CLAUDECODE"}
  - {zrodlo: hyperframes, rev: 8798e40, skill: skills/media-use, regula: "hermes:python_os_environ", plik: "audio/scripts/lib/gemini-auth*.py",
     powod: "odczyt klucza Gemini ze zmiennej GCS_CREDS i testy tej funkcji; floty nie dotyczy (nie mamy klucza Gemini)"}

