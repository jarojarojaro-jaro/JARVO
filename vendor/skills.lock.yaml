# Skille zewnętrzne (third-party), które scripts/build.py kopiuje do profili agentów.
#
# Każde źródło jest przypięte do konkretnego commita. Aktualizacja = zmiana `rev` w PR
# (przejrzyj diff upstreamu!). Licencja jest kopiowana razem ze skillem (LICENSE-UPSTREAM).
# Źródło `hermes` to drzewo Hermesa z obrazu Docker (/opt/hermes), więc jego wersja
# jest zawsze zgodna z wersją uruchomionego Hermesa.
#
# `dest` = <kategoria>/<nazwa> w skills/ profilu. Rodziny skilli, które odwołują się do
# siebie ścieżkami względnymi (../hyperframes-animation/…, ../seo/references/…), MUSZĄ
# lądować w tej samej kategorii.

version: 1

sources:
  hermes:
    type: hermes-tree
    license: MIT
    notice: "Copyright (c) Nous Research. Hermes Agent, MIT License."
  marketingskills:
    type: git
    repo: https://github.com/coreyhaines31/marketingskills
    rev: 5b2c0007766c6a1cf1d53fd8fc73e979e0821022
    license: MIT
    license_file: LICENSE
  web-quality-skills:
    type: git
    repo: https://github.com/addyosmani/web-quality-skills
    rev: afa8da942115f2961fdbfa80807ea0b232ff6c00
    license: MIT
    license_file: LICENSE
  claude-seo:
    type: git
    repo: https://github.com/AgriciDaniel/claude-seo
    rev: e77e783e38eeb738424eb72117abbd2dacdd88af
    license: MIT
    license_file: LICENSE
    # Skille wołają "${CLAUDE_PLUGIN_ROOT}/scripts/claude-seo"; obraz Dockera instaluje
    # ten sam commit do /opt/tars/vendor/claude-seo i ustawia CLAUDE_PLUGIN_ROOT.
  anthropic-skills:
    type: git
    repo: https://github.com/anthropics/skills
    rev: 33375500bcea98d610eb30ce10ac4e59b89c390d
    license: Apache-2.0
    license_file: per-skill        # każdy skill ma własny LICENSE.txt (bierzemy tylko Apache-2.0)
  hyperframes:
    type: git
    repo: https://github.com/heygen-com/hyperframes
    rev: 8798e40da8d56b2f0f3be0b74198d0cbbec1dc06
    license: Apache-2.0
    license_file: LICENSE

