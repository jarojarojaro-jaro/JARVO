# Spis źródeł Jarva: każde repo, z którego bierzemy kod, skille albo wzorce, i te, które obserwujemy.
#
# `scripts/zrodla.py sprawdz` porównuje `przejrzane` z obecnym stanem repo i pokazuje nowości (zmiany, nowe katalogi,
# zmiana licencji). Rutyna pon/śr/pt robi z tego raport do zatwierdzenia przez właściciela; nic nie aktualizuje sama.
# Po przeglądzie: `scripts/zrodla.py przejrzane <nazwa> [commit]`. Przypięcie wersji kopiowanej do floty to osobna
# decyzja: `rev` w skills.lock.yaml (i stała w narzędziu, które instaluje bibliotekę), zawsze po zgodzie właściciela.
#
# status: uzywane       = kod, skill albo wzorce są w Jarvie (opis i licencja w docs/SOURCES.md)
#         do-wdrozenia  = właściciel zatwierdził, wdrażamy
#         czeka         = przejrzane, czeka na decyzję właściciela
#         odlozone      = właściciel odłożył; nowości tylko w skrócie
# przejrzane = ostatni commit, który przejrzeliśmy (pełny SHA). validate.py pilnuje, żeby każde repo z SOURCES.md
# i skills.lock.yaml było w spisie.

