# Rejestr floty TARS: jedno źródło prawdy o tym, kto istnieje.
# Skrypty (scripts/gen-fleet.py, do napisania) generują z tego: opisy profili
# (routing kanbana), skill "roster" dla TARS-a i trasy gateway.profile_routes.
# Szczegóły ról: docs/FLEET.md

version: 1

orchestrator: tars

agents:
  - name: tars
    kind: orchestrator
    title: "Main Judge"
    description: >-
      Main Judge floty. Przyjmuje zlecenia, rozbija je na zadania kanbana dla specjalistów,
      ocenia wyniki według Definition of Done i raportuje. Sam nie wykonuje pracy dziedzinowej.
    model_tier: frontier
    toolsets: [kanban, memory]
    status: planned

  - name: tars-sherlock
    kind: specialist
    title: "Researcher-detektyw"
    description: >-
      Wieloźródłowy research i weryfikacja faktów: rozbija pytanie na wątki, sprawdza źródła
      pierwotne, potwierdza twierdzenia krzyżowo i oddaje raport z cytatami i poziomem pewności.
    model_tier: strong
    status: planned

  - name: tars-web
    kind: specialist
    title: "Web Senior Dev"
    description: >-
      Strony internetowe od A do Z: nowe strony i landingi produktowe, ulepszanie istniejących,
      SEO techniczne, favicony i meta, optymalizacja obrazów, responsywność, wydajność,
      dostępność, wdrożenie. Uczy się marki z istniejącej strony.
    model_tier: strong
    status: planned

  - name: tars-studio
    kind: specialist
    title: "Marketing i kreacja"
    description: >-
      Grafiki promocyjne, posty na social media, filmy z kodu i generowane przez AI, kampanie
      i kalendarze publikacji, zgodnie z brand kitem. Przygotowuje pakiety, nie publikuje bez zgody.
    model_tier: strong
    status: planned

  - name: tars-reka
    kind: generalist
    title: "Prawa ręka"
    description: >-
      Generalista wykonawczy: szybkie zadania, prototypy, sklejanie wyników specjalistów,
      organizacja, propozycje. Ma dostęp do skilli wszystkich agentów, bez ich głębi i pamięci.
    model_tier: strong
    status: planned

shared:
  user_memory: honcho        # decyzja D5, do potwierdzenia
  brand_kits: knowledge/brands
