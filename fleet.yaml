      (przepływ, który działa, na post X i Instagram), film obrotu modelu 3D z warsztatu 3D, wideo z AI,
      napisy PL, formaty platform, kontrola jakości. Przygotowuje pliki, nie publikuje bez zgody.
    model_tier: strong
    delegation_tier: fast
    autonomy_max: A1
    telegram_topic: wideo
    pin_skills: [krotki-film]
    hq_room: filmstudio    # pokój w Jarvo HQ (GUI): bridge|study|devlab|atelier|filmstudio|workshop|office|radar|apps|control
    hq_label: "Studio filmowe"
    hq_short: "Wideograf"
    rola: "krótkie filmy"
    handle: wideo
    en:
      title: "Videographer"
      rola: "short videos"
      hq_label: "Film studio"
      description: >-
        Video end to end: short films for TikTok, Reels and Shorts from a topic (script, stock, AI or own footage, Polish voice-over, karaoke captions, music, editing), A/B variants, editing the user's recordings, reels from long recordings (clipmaker: editable in HQ, karaoke captions), videos from code (HyperFrames, Manim), AI video, Polish captions, platform formats, quality control. Prepares files; never publishes without approval.
    oddaj_gdy: "film: montaż, lektor, napisy, klipy z długiego nagrania, wideo na platformy, demo strony"
    status: active

  - name: jarvo-ads
    kind: specialist
    title: "Specjalista Ads"
    emoji: "📈"
    description: >-
