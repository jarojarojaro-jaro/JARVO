shared:
  user_memory: builtin          # MVP: pamięć wbudowana + wspólny profil użytkownika; faza 3: honcho
  user_profile: knowledge/user/USER.md      # w skarbcu: @@KNOWLEDGE_DIR@@/user/USER.md
  brand_kits: knowledge/brands              # w skarbcu: @@KNOWLEDGE_DIR@@/brands/
  # Katalogi danych floty względem <dane> (HERMES_HOME: w kontenerze /opt/data, natywnie <root>/dane,
  # docs/NATYWNIE.md c1). scripts/build.py składa z nich tokeny @@JARVO_DIR@@, @@KNOWLEDGE_DIR@@, @@MISSIONS_DIR@@,
  # @@WORKSPACES_DIR@@ i @@INBOX_DIR@@ (w kontenerze np. /opt/data/jarvo/missions, jak przed układem natywnym).
  jarvo_dir: jarvo
  knowledge_dir: jarvo/knowledge
  missions_dir: jarvo/missions
  workspaces_dir: jarvo/workspaces
  inbox_dir: jarvo/inbox
  protocol: shared/protocol/kontrakt-zlecenia.md
  timezone: Europe/Warsaw

infra:
  host: vps
  # usługi z projektów, których compose jeszcze nie uruchamia; skill z `metadata.jarvo.wymaga: [usługa]` trafia do profilu
  # dopiero, gdy usługa jest w infra/docker-compose.yml (do tego czasu agent mówi wprost, czego brakuje)
  uslugi_planowane:
    skarbiec: "strażnik budżetu reklam, docs/ADS.md faza 1"
  hermes_image: nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7   # = ARG w infra/Dockerfile
  channels: [telegram, cli, desktop]
