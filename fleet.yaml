# Rejestr floty Jarvo: jedno źródło prawdy o tym, kto istnieje i jak jest spięty.
#
# scripts/build.py czyta ten plik i generuje:
#   - profile.yaml każdego agenta (opis → routing kanbana),
#   - skill `roster` Jarva (kto istnieje, co umie, jakie skille przypinać do kart),
#   - rubryki sędziego (skill `sdlc-review` Jarva) z profiles/<agent>/quality/rubric.md,
#   - model w config.yaml (z poziomu `model_tier`),
#   - config hosta (trasy Telegrama `gateway.profile_routes`).
#
# Szczegóły ról: docs/FLEET.md · anatomia agenta: docs/PROFILE-SPEC.md · Boss: docs/BOSS.md
# Poziomy autonomii: A0 odczyt, A1 szkice we własnym workspace, A2 po zgodzie człowieka, A3 nigdy.

version: 2

orchestrator: jarvo
reviewer: jarvo            # recenzent kart: snajperzy wołają kanban_request_review(reviewer=<to>)

# Dostawca modeli i modele na poziomach. Domyślnie openai-codex (logowanie ChatGPT); inny dostawca bez edycji repo:
# w compose/jarvo.env ustaw JARVO_MODEL_PROVIDER=<nazwa zestawu z `presets`> (klucz dostawcy dodaj
# w dashboardzie Keys przy profilu „default”: trafi do wszystkich agentów). Pojedynczy model można
# nadpisać przez JARVO_MODEL_FRONTIER / JARVO_MODEL_STRONG / JARVO_MODEL_FAST.
# scripts/check-models.py sprawdza przed wdrożeniem, czy identyfikatory istnieją u dostawcy.
models:
  provider: openai-codex                    # OpenAI przez logowanie ChatGPT (OAuth, Models → Login)
  tiers:                                    # jeden model, głębia myślenia per agent (reasoning_effort w config.yaml)
    frontier: gpt-6-luna                    # Jarvo: effort high
    strong: gpt-6-luna                      # specjaliści: effort low
    fast: gpt-6-luna                        # subagenci i rutyny
  presets:                                  # nazwa zestawu = dostawca Hermesa (zweryfikowane 2026-09-27)
    openrouter:                             # OpenRouter (klucz OPENROUTER_API_KEY)
      frontier: anthropic/claude-opus-5.5
      strong: anthropic/claude-sonnet-5
      fast: anthropic/claude-haiku-4.5
    commandcode:                            # CommandCode, modele z podstawowych planów (DeepSeek, Kimi)
      frontier: deepseek/deepseek-v4-pro
      strong: moonshotai/Kimi-K2.6
      fast: deepseek/deepseek-v4-flash
    commandcode-anthropic:                  # CommandCode, Claude: wymaga planu „Provider” lub wyższego
      frontier: claude-opus-5-5
      strong: claude-sonnet-5
      fast: claude-haiku-4-5-20251001
  # model zapasowy, gdy główny odmówi (np. „model poza planem”); klucz: nazwa zestawu
  fallback:
    openai-codex: {provider: commandcode, model: deepseek/deepseek-v4-pro}
    commandcode-anthropic: {provider: commandcode, model: deepseek/deepseek-v4-pro}
    commandcode: {provider: commandcode, model: deepseek/deepseek-v4-flash}
  media:
    image: openrouter                       # image_gen.provider (domyślny łańcuch modeli wtyczki)
    video: openrouter                       # video_gen.provider (domyślny model wtyczki)

agents:
  - name: jarvo
    kind: orchestrator
    title: "Main Judge"
    emoji: "🛰️"
    description: >-
      Main Judge floty. Przyjmuje zlecenia, zakłada misje, rozbija je na karty kanbana dla
      specjalistów, ocenia wyniki według Definition of Done i raportuje. Sam nie wykonuje
      pracy dziedzinowej.
    model_tier: frontier
    delegation_tier: fast
    autonomy_max: A1
    telegram_topic: general       # wątek ogólny grupy „Jarvo HQ” + Twój DM
    hq_room: bridge    # pokój w Jarvo HQ (GUI): bridge|study|devlab|atelier|filmstudio|workshop|office|radar|apps
    hq_label: "Mostek dowodzenia"
    hq_short: "Jarvo"
    en:
      title: "Main Judge"
      hq_label: "Command bridge"
      description: >-
        The fleet's Main Judge. Takes requests, opens missions, splits them into kanban cards for the specialists, reviews results against the Definition of Done and reports. Does no domain work itself.
    status: active

  - name: jarvo-sherlock
    kind: specialist
    title: "Researcher-detektyw"
    emoji: "🔎"
    description: >-
      Wieloźródłowy research i weryfikacja faktów: rozbija pytanie na wątki, sprawdza źródła
      pierwotne, potwierdza twierdzenia krzyżowo i oddaje raport z cytatami i poziomem pewności.
      Research rynku, konkurencji, produktów, słów kluczowych, monitoring. Transkrypcja filmu z linku
      albo pliku (YouTube, TikTok, Instagram): tekst tego, co mówią.
    model_tier: strong
    delegation_tier: fast
    autonomy_max: A1
    telegram_topic: sherlock
    pin_skills: [metoda-sherlocka]
    hq_room: study    # pokój w Jarvo HQ (GUI): bridge|study|devlab|atelier|filmstudio|workshop|office|radar|apps
    hq_label: "Gabinet śledczy"
    hq_short: "Sherlock"
    en:
      title: "Research detective"
      hq_label: "Investigation office"
      description: >-
        Multi-source research and fact-checking: splits a question into threads, checks primary sources, cross-confirms claims and delivers a report with citations and confidence levels. Market, competitor, product and keyword research, monitoring.
    oddaj_gdy: "decyzja zależy od prawdziwości faktów: potrzebne źródła, weryfikacja, research rynku, konkurencji albo SEO"
    status: active

  - name: jarvo-web
    kind: specialist
    title: "Web Senior Dev"
    emoji: "🌐"
    description: >-
      Strony internetowe od A do Z: nowe strony i landingi produktowe, ulepszanie istniejących,
      SEO techniczne, favicony i meta, optymalizacja obrazów, responsywność, wydajność (Core Web
      Vitals), dostępność, wdrożenie. Uczy się marki z istniejącej strony.
    model_tier: strong
    delegation_tier: fast
    autonomy_max: A1
    telegram_topic: web
    hq_room: devlab    # pokój w Jarvo HQ (GUI): bridge|study|devlab|atelier|filmstudio|workshop|office|radar|apps
    hq_label: "Pracownia webowa"
    hq_short: "Web"
    en:
      title: "Web Senior Dev"
      hq_label: "Web studio"
      description: >-
        Websites end to end: new sites and product landing pages, improving existing ones, technical SEO, favicons and meta, image optimisation, responsiveness, performance (Core Web Vitals), accessibility, deployment. Learns the brand from the existing site.
    oddaj_gdy: "strona ma trafić do ludzi (produkcja): budowa, audyt, SEO, wydajność, dostępność, bezpieczeństwo, wdrożenie"
    status: active

  - name: jarvo-studio
    kind: specialist
    title: "Marketing i kreacja"
    emoji: "🎬"
    description: >-
      Grafiki promocyjne, posty na social media, copy, kampanie i kalendarze publikacji,
      zgodnie z brand kitem. Filmy zamawia u Wideografa. Przygotowuje pakiety, nie publikuje
      bez zgody.
    model_tier: strong
    delegation_tier: fast
    autonomy_max: A1
    telegram_topic: studio
    hq_room: atelier    # pokój w Jarvo HQ (GUI): bridge|study|devlab|atelier|filmstudio|workshop|office|radar|apps
    hq_label: "Atelier kreatywne"
    hq_short: "Studio"
    en:
      title: "Marketing & creative"
      hq_label: "Creative atelier"
      description: >-
        Promo graphics, social media posts, copy, campaigns and publishing calendars, all on brand. Orders videos from the Videographer. Prepares packages; never publishes without approval.
    oddaj_gdy: "treść albo grafika ma reprezentować markę publicznie: copy, grafiki social, kampania, kalendarz postów"
    status: active

  - name: jarvo-wideo
    kind: specialist
    title: "Wideograf"
    emoji: "🎥"
    description: >-
      Wideo od A do Z: krótkie filmy na TikTok, Reels i Shorts z tematu (scenariusz, ujęcia stock,
      AI albo własne, polski lektor, napisy karaoke, muzyka, montaż), warianty do testów A/B, montaż
      nagrań użytkownika, rolki z długich nagrań (clipmaker: edytowalne w HQ, napisy karaoke), filmy z kodu (HyperFrames, Manim), wideo z AI,
      napisy PL, formaty platform, kontrola jakości. Przygotowuje pliki, nie publikuje bez zgody.
    model_tier: strong
    delegation_tier: fast
    autonomy_max: A1
    telegram_topic: wideo
    pin_skills: [krotki-film]
    hq_room: filmstudio    # pokój w Jarvo HQ (GUI): bridge|study|devlab|atelier|filmstudio|workshop|office|radar|apps
    hq_label: "Studio filmowe"
    hq_short: "Wideograf"
    en:
      title: "Videographer"
      hq_label: "Film studio"
      description: >-
        Video end to end: short films for TikTok, Reels and Shorts from a topic (script, stock, AI or own footage, Polish voice-over, karaoke captions, music, editing), A/B variants, editing the user's recordings, reels from long recordings (clipmaker: editable in HQ, karaoke captions), videos from code (HyperFrames, Manim), AI video, Polish captions, platform formats, quality control. Prepares files; never publishes without approval.
    oddaj_gdy: "film: montaż, lektor, napisy, klipy z długiego nagrania, wideo na platformy, demo strony"
    status: active

  - name: jarvo-ads
    kind: specialist
    title: "Specjalista Ads"
    emoji: "📈"
    description: >-
      Płatne reklamy Meta Ads (Facebook, Instagram) i Google Ads od A do Z: planowanie kampanii,
      struktura, odbiorcy, słowa kluczowe, budżety, testy A/B/C, raporty wyników i wnioski dla kreacji;
      stawianie kampanii, codzienna kontrola konta i optymalizacja przez Skarbiec, gdy jest zainstalowany.
      Wydaje pieniądze tylko w kopercie zatwierdzonej kodem przez użytkownika.
    model_tier: strong
    delegation_tier: fast
    autonomy_max: A1
    telegram_topic: ads
    pin_skills: [plan-kampanii]
    hq_room: office    # pokój w Jarvo HQ (GUI): bridge|study|devlab|atelier|filmstudio|workshop|office|radar|apps
    hq_label: "Sala operacyjna"
    hq_short: "Ads"
    en:
      title: "Ads specialist"
      hq_label: "Operations room"
      description: >-
        Paid ads on Meta Ads (Facebook, Instagram) and Google Ads end to end: campaign planning, structure, audiences, keywords, budgets, launching campaigns, daily account checks, optimisation, A/B/C tests, performance reports and learnings for creatives. Spends money only within a budget envelope the user approves with a code.
    oddaj_gdy: "płatne reklamy Meta albo Google: plan kampanii z budżetem, test kreacji, audyt konta, raport z eksportu"
    status: active

  - name: jarvo-lowca
    kind: specialist
    title: "Łowca leadów"
    emoji: "🎯"
    description: >-
      Szukanie klientów (leadów B2B) po sygnałach zakupowych z oficjalnych źródeł: nowe firmy w KRS,
      przetargi (e-Zamówienia, TED) i ich zwycięzcy, oferty pracy, technologia i zmiany na stronach firm,
      newsy. Profil idealnego klienta, kwalifikacja, ranking firm z „dlaczego teraz”, kontakt opublikowany
      przez firmę (ze źródłem), monitoring nowych leadów. Niczego nie wysyła.
    model_tier: strong
    delegation_tier: fast
    autonomy_max: A1
    telegram_topic: lowca
    pin_skills: [profil-klienta]
    hq_room: radar    # pokój w Jarvo HQ (GUI): bridge|study|devlab|atelier|filmstudio|workshop|office|radar|apps
    hq_label: "Radar sprzedaży"
    hq_short: "Łowca"
    en:
      title: "Lead hunter"
      hq_label: "Sales radar"
      description: >-
        Finds B2B leads from buying signals in official sources: new companies in the KRS register, public tenders (e-Zamówienia, TED) and their winners, job ads, technology and changes on company websites, news. Ideal customer profile, qualification, a ranked list of companies with "why now", contacts the company published itself (with the source), monitoring for new leads. Never sends anything.
    oddaj_gdy: "szukanie klientów B2B: profil idealnego klienta, firmy z sygnałem zakupowym (KRS, przetargi, rekrutacje), lista leadów"
    status: active

  - name: jarvo-mobile
    kind: specialist
    title: "Twórca aplikacji"
    emoji: "📱"
    description: >-
      Aplikacje mobilne dla małych firm: uczciwa decyzja „natywna czy PWA” z kosztami i ryzykiem odrzucenia w sklepie
      (strona, PWA, karta w Wallet, gotowa platforma albo aplikacja w App Store i Google Play) oraz darmowy audyt mobilny
      dowolnej firmy: aplikacje w sklepach (świeżość, oceny, polska karta, prywatność, status przedsiębiorcy DSA), opinie
      z App Store, linki strona → aplikacja (Universal Links, App Links), baner i PWA. Aplikacje Expo (React Native) z szablonu
      ze zgodnością ze sklepami od planu (także ze strony firmy): prototyp, kontrole, podgląd w HQ i na telefonie w Expo Go,
      bramka jakości, pakiet do sklepów, wydanie i poprawki przez EAS Update za zgodą, terminy sklepów i opinie po wydaniu.
      Konta zawsze właściciela.
    model_tier: strong
    delegation_tier: fast
    autonomy_max: A1
    telegram_topic: mobile
    pin_skills: [natywna-czy-pwa]
    hq_room: apps    # pokój w Jarvo HQ (GUI): bridge|study|devlab|atelier|filmstudio|workshop|office|radar|apps
    hq_label: "Pracownia aplikacji"
    hq_short: "Aplikacje"
    en:
      title: "App maker"
      hq_label: "App lab"
      description: >-
        Mobile apps for small businesses: an honest "native or PWA" decision with costs and app-store rejection risk (website, PWA, Wallet pass, an existing platform or an App Store and Google Play app) and a free mobile audit of any company: apps in the stores (freshness, ratings, Polish listing, privacy, EU trader status), App Store reviews, website-to-app links (Universal Links, App Links), smart banner and PWA. Expo (React Native) apps from a template with store compliance built in from the plan: prototype, checks, preview in HQ and on the owner's phone in Expo Go. Accounts always belong to the owner.
    oddaj_gdy: "aplikacja mobilna: czy firmie potrzebna (natywna, PWA, Wallet), prototyp i budowa aplikacji, podgląd na telefonie, audyt aplikacji w App Store i Google Play"
    status: active

  - name: jarvo-reka
    kind: generalist
    title: "Prawa ręka"
    emoji: "🦾"
    description: >-
      Generalista wykonawczy: szybkie zadania, dokumenty i konwersje, prototypy, organizacja,
      składanie wyników specjalistów w pakiet końcowy misji. Zna skille wszystkich agentów
      (tylko do odczytu), bez ich głębi i pamięci.
    model_tier: strong
    delegation_tier: fast
    autonomy_max: A1
    telegram_topic: reka
    hq_room: workshop    # pokój w Jarvo HQ (GUI): bridge|study|devlab|atelier|filmstudio|workshop|office|radar|apps
    hq_label: "Warsztat"
    hq_short: "Ręka"
    en:
      title: "Right hand"
      hq_label: "Workshop"
      description: >-
        Hands-on generalist: quick tasks, documents and conversions, prototypes, organisation, assembling the specialists' results into the final mission package. Knows every agent's skills (read-only), without their depth or memory.
    status: active

shared:
  user_memory: builtin          # MVP: pamięć wbudowana + wspólny profil użytkownika; faza 3: honcho
  user_profile: knowledge/user/USER.md      # na VPS: /opt/data/jarvo/knowledge/user/USER.md
  brand_kits: knowledge/brands              # na VPS: /opt/data/jarvo/knowledge/brands/
  missions_dir: /opt/data/jarvo/missions
  workspaces_dir: /opt/data/jarvo/workspaces
  protocol: shared/protocol/kontrakt-zlecenia.md
  timezone: Europe/Warsaw

infra:
  host: vps
  # usługi z projektów, których compose jeszcze nie uruchamia; skill z `metadata.jarvo.wymaga: [usługa]` trafia do profilu
  # dopiero, gdy usługa jest w infra/docker-compose.yml (do tego czasu agent mówi wprost, czego brakuje)
  uslugi_planowane:
    skarbiec: "strażnik budżetu reklam, docs/ADS.md faza 1"
  hermes_image: nousresearch/hermes-agent:latest   # przypnij do wersji/digestu przy pierwszym wdrożeniu
  channels: [telegram, cli, desktop]
