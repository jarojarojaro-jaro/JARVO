    hq_label: "Sterownia"
    hq_short: "Operator"
    rola: "pracuje na Komputerze Jarva"
    handle: operator
    komputer: true      # computer_use na Komputerze Jarva, wtyczka jarvo-komputer, bez terminala (docs/KOMPUTER.md)
    en:
      title: "Operator"
      rola: "works on Jarvo's Computer"
