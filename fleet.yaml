    delegation_tier: fast
    autonomy_max: A1
    telegram_topic: lowca
    pin_skills: [profil-klienta]
    hq_room: radar    # pokój w Jarvo HQ (GUI): bridge|study|devlab|atelier|filmstudio|workshop|office|radar|apps|control
    hq_label: "Radar sprzedaży"
    hq_short: "Łowca"
