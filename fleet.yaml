    delegation_tier: fast
    autonomy_max: A1
    telegram_topic: mobile
    pin_skills: [natywna-czy-pwa]
    hq_room: apps    # pokój w Jarvo HQ (GUI): bridge|study|devlab|atelier|filmstudio|workshop|office|radar|apps|control
    hq_label: "Pracownia aplikacji"
    hq_short: "Aplikacje"
    rola: "aplikacje na telefon"
