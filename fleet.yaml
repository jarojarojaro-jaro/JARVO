    model_tier: strong
    delegation_tier: fast
    autonomy_max: A1
    telegram_topic: studio
    hq_room: atelier    # pokój w Jarvo HQ (GUI): bridge|study|devlab|atelier|filmstudio|workshop|office|radar|apps|control
    hq_label: "Atelier kreatywne"
    hq_short: "Studio"
    rola: "grafiki i posty"
    handle: studio
    en:
      title: "Marketing & creative"
      rola: "graphics and posts"
      hq_label: "Creative atelier"
      description: >-
        Promo graphics, social media posts, living photos (loops and PSD layers), copy, campaigns and publishing calendars, all on brand. Orders videos from the Videographer. Prepares packages; never publishes without approval.
    oddaj_gdy: "treść albo grafika ma reprezentować markę publicznie: copy, grafiki social, kampania, kalendarz postów"
