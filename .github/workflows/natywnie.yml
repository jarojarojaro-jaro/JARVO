# Jarvo natywnie: pełna macierz instalacji (docs/NATYWNIE.md: T08, T14, T15, T17, T18, (g) „Runnery CI” i „Kiedy co
# biegnie”, (l) „Kiedy całość jest gotowa”). Na 5 runnerach instalacja od zera DOKŁADNIE poleceniem z README, ale
# z kodem z tego commitu: bootstrap spod raw.githubusercontent.com/<repo>/<SHA>/… i JARVO_REF=<SHA> (bootstrap
# pobiera wtedy archiwum tego commitu). Potem tests/live/natywnie_e2e.py:
#   - jarvo doctor --json zielony poza jawnymi wyjątkami runnera (`dopusc` w macierzy), jarvo status, panel, flota,
#   - czat z atrapą modelu (scripts/atrapa_modelu.py): jarvo chat -q i /v1/runs bramy z prośbą o zgodę wtyczki
#     jarvo-zgody, zgodą i odmową; zlecenie specjaliście (karta kanbana, którą robi pracownik bramy na atrapie),
#   - opcjonalnie jedna tura z prawdziwym modelem: tylko z sekretem JARVO_TEST_OPENROUTER_KEY, który trafia wyłącznie
#     do otoczenia tego jednego kroku i skanu (nigdy do echo ani do artefaktów),
#   - funkcje na żywo: media (tests/live/natywnie_media.py: lektor, STT, film, HTML, HyperFrames, edytor, głos,
#     narzędzia npm), dokumenty i OCR (natywnie_dokumenty.py --pytest), miejsce na dysku (natywnie_miejsce.py:
#     sprzątanie, szacunek, dyski, przebieg bez sieci, zamki, odmowy), telefon, 3D i ManimGX przy pierwszym użyciu
#     (natywnie_telefon_3d.py; adb, android i scrcpy pominięte bez akceptacji licencji Android SDK przez właściciela),
#   - drugi przebieg tego samego polecenia instalacji niczego nie zmienia,
#   - aktualizacja na żywo (tests/live/natywnie_update.py, wersje testowe przez JARVO_FAKE_KOD, bez sieci i pushy):
#     ta sama wersja, nowsza obok starej, zepsuta wraca do poprzedniej, przycisk w panelu przez pomocnika pod
#     nadzorcą (usługa aktualizacje), sprzątanie starych wersji,
#   - jarvo uninstall --all --yes, a migawka katalogów, PATH i autostartu po nim jest taka jak przed instalacją
#     (różnica pusta poza listą wyjątków z powodami w natywnie_e2e.py).
# Linux: runner nie ma sesji systemd użytkownika (user bus), więc instalacja z JARVO_NO_AUTOSTART=1 (oba przebiegi,
# inaczej drugi włączałby autostart). Artefakty (logi instalacji i usług, doctor.json, raport, różnica migawek, zrzuty
# z obszaru e6 w <artefakty>/zrzuty, gdy będą) idą zawsze, ale dopiero po skanie sekretów i z retencją 14 dni: logi
# i artefakty repo publicznego widzi każdy. Minuty macOS liczą się ×10 (przy repo prywatnym), więc bez pushy na każdy
# commit: ręcznie, przy tagach v* i przy pushu na main w plikach instalatora i manifestu (dla tagów GitHub nie
# sprawdza `paths`). Akcje przypięte pełnym SHA (T17); tests/test_ci_natywnie.py pilnuje struktury tego pliku.
name: natywnie

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "jarvo/**"
      - "vendor/natywne*"
      - "infra/python/natywne/**"
      - "tests/live/natywnie_*.py"
      - "scripts/komputer_natywny_test.py"
      - "scripts/build.py"
      - "scripts/install_fleet.py"
      - "komputer/**"
      - "hq/**"
      - "zgody/**"
      - "infra/node/**"
      - "infra/bin/jarvo-stt"
      - "infra/bin/jarvo-tts"
      - "profiles/jarvo-wideo/scripts/**"
      - "profiles/jarvo-studio/scripts/render_html.cjs"
      - "profiles/jarvo-reka/scripts/**"
      - "profiles/jarvo-mobile/scripts/**"
      - "shared/skills/warsztat-3d/**"
      - "shared/skills/konwersja-plikow/**"
      - "shared/skills/odczyt-ekranu/**"
      - "tests/test_konwertuj.py"
      - "tests/test_ocr.py"
      - ".github/workflows/natywnie.yml"

permissions:
  contents: read

# bez przerywania: nogi Windows biegną najdłużej (ok. 90 min), a każdy push na main w trakcie ucinał je, zanim
# skończyły; trwający przebieg dobiega do końca, a najnowszy commit czeka w kolejce (GitHub trzyma jeden oczekujący)
concurrency:
  group: natywnie-${{ github.ref }}
  cancel-in-progress: false

jobs:
  instalacja:
    name: ${{ matrix.noga }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # nogi z docs/NATYWNIE.md (g) „Runnery CI”; `dopusc` = jawne wyjątki doctora tego runnera (NAZWA=stan:powód;…)
        include:
          - noga: W64
            os: windows-2025
            bez_autostartu: ""
            dopusc_media: ""
            dopusc_e11: "manimgx=render ManimGX na runnerze bez GPU niesprawdzony (docs/NATYWNIE.md M04)"
            dopusc: >-
              wolne miejsce=uwaga:dysk runnera bywa mniejszy niż 10 GB wolnego;
              rutyny=uwaga:świeża instalacja bez Telegrama, rutyny czekają na jarvo telegram test albo jarvo rutyny on; Telegram=uwaga:CI bez bota, jarvo telegram ustaw robi właściciel
          - noga: WARM
            os: windows-11-arm
            bez_autostartu: ""
            dopusc_media: ""
            dopusc_e11: "manimgx=render ManimGX na Windows arm64 (koło x64 w emulacji) niesprawdzony"
            dopusc: >-
              wolne miejsce=uwaga:dysk runnera bywa mniejszy niż 10 GB wolnego;
              rutyny=uwaga:świeża instalacja bez Telegrama, rutyny czekają na jarvo telegram test albo jarvo rutyny on; Telegram=uwaga:CI bez bota, jarvo telegram ustaw robi właściciel
          - noga: MARM
            os: macos-15
            bez_autostartu: ""
            dopusc_media: ""
            dopusc_e11: "manimgx=render ManimGX przez Metal na runnerze macOS niesprawdzony"
            dopusc: >-
              wolne miejsce=uwaga:dysk runnera bywa mniejszy niż 10 GB wolnego;
              rutyny=uwaga:świeża instalacja bez Telegrama, rutyny czekają na jarvo telegram test albo jarvo rutyny on; Telegram=uwaga:CI bez bota, jarvo telegram ustaw robi właściciel
          - noga: L64
            os: ubuntu-24.04
            bez_autostartu: "1"
            dopusc_media: ""
            dopusc_e11: ""
            dopusc: >-
              wolne miejsce=uwaga:dysk runnera bywa mniejszy niż 10 GB wolnego;
              autostart=uwaga:runner bez user busa systemd, instalacja z JARVO_NO_AUTOSTART=1;
              rutyny=uwaga:świeża instalacja bez Telegrama, rutyny czekają na jarvo telegram test albo jarvo rutyny on; Telegram=uwaga:CI bez bota, jarvo telegram ustaw robi właściciel
          - noga: LARM
            os: ubuntu-24.04-arm
            bez_autostartu: "1"
            dopusc_media: ""
            dopusc_e11: ""
            dopusc: >-
              wolne miejsce=uwaga:dysk runnera bywa mniejszy niż 10 GB wolnego;
              autostart=uwaga:runner bez user busa systemd, instalacja z JARVO_NO_AUTOSTART=1;
              rutyny=uwaga:świeża instalacja bez Telegrama, rutyny czekają na jarvo telegram test albo jarvo rutyny on; Telegram=uwaga:CI bez bota, jarvo telegram ustaw robi właściciel
    env:
      JARVO_E2E_NOGA: ${{ matrix.noga }} (${{ matrix.os }})
      # tylko „tak” albo „nie”: sama wartość sekretu nie trafia do otoczenia zadania (instalatora, usług, kroków)
      JARVO_E2E_KLUCZ: ${{ secrets.JARVO_TEST_OPENROUTER_KEY != '' && 'tak' || 'nie' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Python do skryptu testu (sama biblioteka standardowa; Jarvo bierze własnego Pythona z bootstrapu)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      # Node w wersji z vendor/natywne.yaml: instalator buduje front panelu npm-em z PATH, dopóki Node z manifestu
      # (B03) nie jest jego krokiem; potem ten krok tylko przypina wersję obecną na runnerze
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.12.1"
          package-manager-cache: false

      - name: Środowisko runnera
        run: |
          mkdir -p "$RUNNER_TEMP/natywnie-artefakty"
          python -c "import platform, sys; print(platform.platform(), platform.machine(), 'Python', sys.version.split()[0])"
          git --version
          node --version
          npm --version
          df -h "$HOME" || true

      - name: Migawka komputera przed instalacją
        run: python -X utf8 -B tests/live/natywnie_e2e.py migawka --wyjscie "$RUNNER_TEMP/natywnie-artefakty/migawka-przed.json"

      # --- instalacja poleceniem z README (Windows PowerShell 5.1 jak u zwykłego użytkownika; macOS i Linux bash)
      - name: Instalacja (Windows, irm | iex)
        if: runner.os == 'Windows'
        shell: powershell
        timeout-minutes: 90
        env:
          JARVO_REF: ${{ github.sha }}
        run: |
          try { [Console]::OutputEncoding = [Text.Encoding]::UTF8 } catch { Write-Verbose "OutputEncoding: $_" }
          $log = Join-Path $env:RUNNER_TEMP 'natywnie-artefakty\instalacja-1.log'
          irm "https://raw.githubusercontent.com/jarojarojaro-jaro/JARVO/$env:JARVO_REF/jarvo/bootstrap/install.ps1" | iex 6>&1 | Tee-Object -FilePath $log

      # macOS: najpierw katalogi systemu, jak na Macu bez Homebrew: `bash` to /bin/bash 3.2, git z narzędzi Xcode
      - name: Instalacja (macOS i Linux, curl | bash)
        if: runner.os != 'Windows'
        timeout-minutes: 90
        env:
          JARVO_REF: ${{ github.sha }}
          JARVO_NO_AUTOSTART: ${{ matrix.bez_autostartu }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"; fi
          curl -fsSL "https://raw.githubusercontent.com/jarojarojaro-jaro/JARVO/$JARVO_REF/jarvo/bootstrap/install.sh" | bash 2>&1 | tee "$RUNNER_TEMP/natywnie-artefakty/instalacja-1.log"

      # --- na żywo: doctor, status, panel, flota, czat i zgody na atrapie modelu, karta kanbana dla specjalisty
      - name: Test na żywo (doctor, status, panel, czat, zgody, kanban)
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        env:
          DOPUSC: ${{ matrix.dopusc }}
        run: python -X utf8 -B tests/live/natywnie_e2e.py sprawdz --dopusc "$DOPUSC"

      # --- E9 i narzędzia npm floty: media na żywo (pierwsze STT pobiera Parakeeta 0,67 GB)
      - name: Media na żywo (lektor, STT, film, HTML, HyperFrames, edytor, głos, narzędzia npm)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        env:
          DOPUSC_MEDIA: ${{ matrix.dopusc_media }}
        run: python -X utf8 -B tests/live/natywnie_media.py --wyniki "$RUNNER_TEMP/natywnie-artefakty/media" --dopusc "$DOPUSC_MEDIA"

      # --- dokumenty i OCR na żywo (E8): konwerter, OCR, to_pdf.py, pack.py, Konwerter w panelu, SVG → PNG, a z --pytest
      #     tests/test_konwertuj.py i tests/test_ocr.py na programach i venvach z instalacji (pytest i PyYAML jak
      #     w requirements-dev.txt; bez shellcheck-py, który nie ma koła win_arm64)
      - name: Dokumenty i OCR na żywo (konwerter, OCR, to_pdf.py, pack.py, Konwerter w panelu, pytest)
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: |
          python -m pip install --disable-pip-version-check -q "pytest>=8,<10" "PyYAML>=6,<7"
          python -X utf8 -B tests/live/natywnie_dokumenty.py --pytest --wyniki "$RUNNER_TEMP/natywnie-artefakty/dokumenty"

      # --- miejsce: sprzątanie po instalacji, każda część w szacunku z manifestu, dyski do polecenia
      - name: Miejsce na dysku po instalacji (sprzątanie, szacunek, doctor)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: python -X utf8 -B tests/live/natywnie_miejsce.py sprawdz

      - name: Dyski do polecenia i system plików korzenia
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python -X utf8 -B tests/live/natywnie_miejsce.py dyski

      # --- panel w przeglądarce (E6): wejście bez hasła, pierwsze spotkanie, mózg z atrapy, pierwsza sesja, pliki,
      # restart panelu; zrzuty jasny i ciemny 1440 i 390 px w artefaktach (zrzuty/)
      - name: Panel na żywo (Playwright, zrzuty)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: python -X utf8 -B tests/live/natywnie_e2e.py panel

      # --- Komputer Jarva (E10): przeglądarka z manifestu z sumą, strona testowa przez bramkę jak Hermes, twarde zasady
      - name: Komputer Jarva na żywo
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: python -X utf8 -B tests/live/natywnie_e2e.py komputer

      - name: Prawdziwy model (tylko z sekretem JARVO_TEST_OPENROUTER_KEY)
        if: ${{ !cancelled() && env.JARVO_E2E_KLUCZ == 'tak' }}
        timeout-minutes: 15
        env:
          JARVO_TEST_OPENROUTER_KEY: ${{ secrets.JARVO_TEST_OPENROUTER_KEY }}
        run: python -X utf8 -B tests/live/natywnie_e2e.py prawdziwy-model

      # --- telefon, 3D i ManimGX przy pierwszym użyciu (E11); licencję Android SDK akceptuje właściciel, więc bez
      #     --akceptuje-licencje-sdk punkty adb, android i scrcpy są pominięte
      - name: Telefon, 3D i ManimGX (pierwsze użycie)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        env:
          DOPUSC_E11: ${{ matrix.dopusc_e11 }}
        run: >-
          python -X utf8 -B tests/live/natywnie_telefon_3d.py
          --wyniki "$RUNNER_TEMP/natywnie-artefakty/telefon-3d"
          --limit 2100 --raport-e2e --dopusc "$DOPUSC_E11"

      # --- drugi przebieg tego samego polecenia: „Zmiany w tym przebiegu: brak.”, nic pobrane ponownie
      - name: Drugi przebieg instalacji (Windows, irm | iex)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: powershell
        timeout-minutes: 45
        env:
          JARVO_REF: ${{ github.sha }}
        run: |
          try { [Console]::OutputEncoding = [Text.Encoding]::UTF8 } catch { Write-Verbose "OutputEncoding: $_" }
          $log = Join-Path $env:RUNNER_TEMP 'natywnie-artefakty\instalacja-2.log'
          irm "https://raw.githubusercontent.com/jarojarojaro-jaro/JARVO/$env:JARVO_REF/jarvo/bootstrap/install.ps1" | iex 6>&1 | Tee-Object -FilePath $log

      - name: Drugi przebieg instalacji (macOS i Linux, curl | bash)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 45
        env:
          JARVO_REF: ${{ github.sha }}
          JARVO_NO_AUTOSTART: ${{ matrix.bez_autostartu }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"; fi
          curl -fsSL "https://raw.githubusercontent.com/jarojarojaro-jaro/JARVO/$JARVO_REF/jarvo/bootstrap/install.sh" | bash 2>&1 | tee "$RUNNER_TEMP/natywnie-artefakty/instalacja-2.log"

      - name: Drugi przebieg niczego nie zmienił
        if: ${{ !cancelled() }}
        run: python -X utf8 -B tests/live/natywnie_e2e.py drugi-przebieg "$RUNNER_TEMP/natywnie-artefakty/instalacja-2.log"

      # --- aktualizacja na żywo: jarvo update i przycisk w panelu (pomocnik pod nadzorcą)
      - name: Aktualizacja na żywo (jarvo update, przycisk w panelu)
        if: ${{ !cancelled() }}
        timeout-minutes: 80
        run: python -X utf8 -B tests/live/natywnie_update.py aktualizacja --limit 4500

      # --- miejsce: przebieg bez sieci, sprzątanie przy drugim instalatorze, odmowy przed zapisem
      - name: Przebieg instalacji bez sieci (HTTPS_PROXY na martwy port)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          FLAGI: ${{ matrix.bez_autostartu == '1' && '--bez-autostartu' || '' }}
        run: python -X utf8 -B tests/live/natywnie_miejsce.py bez-sieci -- $FLAGI

      - name: Sprzątanie przy drugim instalatorze (zamki)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: python -X utf8 -B tests/live/natywnie_miejsce.py zamki

      - name: Odmowa przy braku miejsca i na dysku bez ochrony (atrapy, niczego nie instaluje)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: python -X utf8 -B tests/live/natywnie_miejsce.py odmowa

      # --- odinstalowanie i migawka po: komputer jak przed instalacją
      - name: Logi instalacji i usług do artefaktów
        if: ${{ !cancelled() }}
        run: python -X utf8 -B tests/live/natywnie_e2e.py zbierz-logi

      - name: Odinstalowanie (jarvo uninstall --all --yes)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: python -X utf8 -B tests/live/natywnie_e2e.py odinstaluj

      - name: Migawka po odinstalowaniu i różnica
        if: ${{ !cancelled() }}
        run: |
          python -X utf8 -B tests/live/natywnie_e2e.py migawka --wyjscie "$RUNNER_TEMP/natywnie-artefakty/migawka-po.json"
          python -X utf8 -B tests/live/natywnie_e2e.py roznica "$RUNNER_TEMP/natywnie-artefakty/migawka-przed.json" "$RUNNER_TEMP/natywnie-artefakty/migawka-po.json"

      # --- artefakty: najpierw skan sekretów (plik z trafieniem znika), potem podsumowanie i wysyłka
      - name: Skan sekretów przed wysyłką
        id: skan
        if: always()
        env:
          JARVO_TEST_OPENROUTER_KEY: ${{ secrets.JARVO_TEST_OPENROUTER_KEY }}
        run: python -X utf8 -B tests/live/natywnie_e2e.py skan "$RUNNER_TEMP/natywnie-artefakty"

      - name: Podsumowanie
        if: always()
        run: python -X utf8 -B tests/live/natywnie_e2e.py podsumowanie

      - name: Artefakty
        if: always() && steps.skan.outputs.gotowe == 'tak'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: natywnie-${{ matrix.noga }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/natywnie-artefakty
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: false
