# Walidacja floty i testy przy każdym pushu i PR. Bez sekretów: nic tu nie woła modeli ani VPS.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Zależności testów
        run: pip install pyyaml pytest
      - name: Walidacja repo
        run: python scripts/validate.py
      - name: Testy
        run: python -m pytest -q tests
      - name: Składnia skryptów powłoki
        run: |
          for f in scripts/*.sh profiles/*/scripts/*.sh; do bash -n "$f"; done
