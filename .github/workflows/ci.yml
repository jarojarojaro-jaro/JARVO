# Walidacja floty i testy przy każdym pushu i PR. Bez sekretów: nic tu nie woła modeli ani VPS.
name: ci

on:
  # gałąź robocza dostaje te same commity co main (push main i main:claude/...), więc testujemy raz, na main
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Zależności testów
        run: pip install pyyaml pytest fastapi httpx
      - name: Walidacja repo
        run: python scripts/validate.py
      - name: Testy
        run: python -m pytest -q tests
      # każdy śledzony plik .sh (instalatory, bootstrap, skrypty repo); skrypty profili są już w Pythonie, więc stary
      # wzorzec profiles/*/scripts/*.sh nic nie znajdował i bash dostawał dosłowną gwiazdkę (kod 127)
      - name: Składnia skryptów powłoki
        run: |
          git ls-files -z '*.sh' | xargs -0 -n1 bash -n

  # Jarvo natywnie (docs/NATYWNIE.md, etap E1): te same testy na Windows i macOS, wymagane (pierwszy pełny zielony
  # przebieg na trzech systemach: 743fb81).
  testy-systemy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Zależności testów
        run: pip install pyyaml pytest fastapi httpx tzdata
      - name: Testy
        run: python -m pytest -q -rfE -p no:cacheprovider --continue-on-collection-errors tests
