# Obraz floty jarvo-hermes dla amd64 i arm64 w GHCR. Instalator i deploy.sh pobierają go zamiast budować
# (scripts/obraz.sh): kilkanaście minut budowy i 8 GB RAM u użytkownika → 2–3 minuty pobierania.
# Tag src-<klucz> to skrót tego, z czego obraz powstaje (infra/Dockerfile, infra/node, infra/python, infra/bin,
# branding); ten sam klucz liczy scripts/obraz.sh na komputerze użytkownika. Obraz dla danego klucza budujemy raz.
name: obraz

on:
  push:
    branches: [main]
    paths:
      - infra/Dockerfile
      - infra/node/**
      - infra/python/**
      - infra/bin/**
      - branding/**
      - scripts/obraz.sh
      - .github/workflows/obraz.yml
  workflow_dispatch:
    inputs:
      wymus:
        description: "Zbuduj, nawet jeśli obraz dla tego klucza już jest (np. nowa wersja Hermesa)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: obraz-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jarojarojaro-jaro/jarvo-hermes

jobs:
  klucz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      klucz: ${{ steps.k.outputs.klucz }}
      jest: ${{ steps.k.outputs.jest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: k
        env:
          WYMUS: ${{ inputs.wymus }}
        run: |
          echo "klucz=$(bash scripts/obraz.sh klucz)" >> "$GITHUB_OUTPUT"
          if [[ "$WYMUS" != true ]] && JARVO_IMAGE_REPO="$IMAGE" bash scripts/obraz.sh jest; then
            echo "jest=true" >> "$GITHUB_OUTPUT"; echo "Obraz dla tego klucza już jest w rejestrze."
          else echo "jest=false" >> "$GITHUB_OUTPUT"; fi

  budowa:
    needs: klucz
    if: needs.klucz.outputs.jest != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platforma: linux/amd64
            runner: ubuntu-24.04
          - platforma: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Miejsce na dysku (obraz ~6 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af >/dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: ${{ matrix.platforma }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=jarvo-hermes
            org.opencontainers.image.revision=${{ github.sha }}
            pl.jarvo.klucz=${{ needs.klucz.outputs.klucz }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
      - name: Zapisz digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publikacja:
    needs: [klucz, budowa]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Manifest amd64 + arm64
        env:
          KLUCZ: ${{ needs.klucz.outputs.klucz }}
        run: |
          cd /tmp/digests
          docker buildx imagetools create -t "$IMAGE:src-$KLUCZ" -t "$IMAGE:latest" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:src-$KLUCZ"
