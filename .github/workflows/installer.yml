# Instalator na prawdziwych systemach (docs/INSTALER.md): każda zmiana instalatora i obrazu przechodzi przez Linuksa
# od zera i macOS z jego bashem 3.2, zanim trafi do ludzi.
#  - linux: świeży kontener Ubuntu bez gita, Pythona i Dockera → install.sh → Docker Engine → jarvo up pobiera
#    gotowy obraz z GHCR → dashboard → aktualizacja → down → uninstall (scripts/install-test.sh, JARVO_TEST_PULL=1);
#  - macos: install.sh na prawdziwym macOS przekazuje do instalacji natywnej (bash 3.2, próba na sucho), a bin/jarvo
#    starej instalacji (pomoc, wersja, plist LaunchAgenta) działa do czasu jej przeniesienia (jarvo migruj);
#  - Windows: instalacja natywna (install.ps1 przekierowuje na jarvo/bootstrap/install.ps1), test w natywnie.yml.
name: installer

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - bin/jarvo
      - scripts/local-up.sh
      - scripts/deploy.sh
      - scripts/obraz.sh
      - scripts/install-test.sh
      - infra/docker-compose.yml
      # obraz floty też: nowa zależność w obrazie przechodzi przez instalację od zera (job linux czeka na obraz.yml)
      - infra/Dockerfile
      - infra/node/**
      - infra/python/**
      - infra/bin/**
      - infra/autostart/**
      - tests/test_installer.py
      - .github/workflows/installer.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testy instalatora (pytest, shellcheck)
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest -q tests/test_installer.py
      - name: Miejsce na dysku (obraz floty ~6 GB w Dockerze w kontenerze)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Gotowy obraz dla tej wersji (obraz.yml może jeszcze budować)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in $(seq 1 45); do
            bash scripts/obraz.sh jest && { echo "Obraz src-$(bash scripts/obraz.sh klucz) jest."; exit 0; }
            echo "Czekam na obraz src-$(bash scripts/obraz.sh klucz) ($i/45)…"; sleep 60
          done
          echo "::error::Brak obrazu w GHCR dla tej wersji (workflow obraz)"; exit 1
      - name: Instalacja od zera w świeżym Ubuntu 24.04
        env:
          JARVO_TEST_PULL: "1"
          JARVO_TOKEN: ${{ github.token }}
          JARVO_LOCAL: ${{ runner.temp }}/jarvo-test
        run: bash scripts/install-test.sh ubuntu:24.04

  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Składnia w bashu 3.2 z macOS
        run: |
          /bin/bash --version | head -1
          for f in install.sh bin/jarvo scripts/local-up.sh scripts/deploy.sh scripts/obraz.sh; do /bin/bash -n "$f"; done
      - name: Próba na sucho na prawdziwym macOS (przekazanie do instalacji natywnej)
        run: |
          out="$(JARVO_DRY_RUN=1 JARVO_DIR="$RUNNER_TEMP/jarvo" /bin/bash install.sh 2>&1)"; echo "$out"
          grep -q "Jarvo na macOS działa natywnie" <<<"$out"
          grep -qF "curl -fsSL https://raw.githubusercontent.com/jarojarojaro-jaro/JARVO/main/jarvo/bootstrap/install.sh | bash" <<<"$out"
          ! grep -q "apt-get\|get.docker.com\|colima\|brew install" <<<"$out"
      - name: Polecenie jarvo na macOS (LaunchAgent, pomoc, wersja)
        run: |
          bash bin/jarvo help | grep -q "jarvo autostart"
          bash bin/jarvo version
          JARVO_LOCAL="$RUNNER_TEMP/flota" bash bin/jarvo autostart print > "$RUNNER_TEMP/pl.jarvo.updater.plist"
          plutil -lint "$RUNNER_TEMP/pl.jarvo.updater.plist"
          grep -q "<string>$PWD/bin/jarvo</string>" "$RUNNER_TEMP/pl.jarvo.updater.plist"

